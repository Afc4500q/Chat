<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 80%; }
        button { padding: 10px 20px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>تسجيل الدخول</h2>
    <input type="text" id="user" placeholder="اسم المستخدم">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p id="message"></p>

    <script>
        async function login() {
            const user = document.getElementById("user").value;
            const pass = document.getElementById("pass").value;
            const message = document.getElementById("message");

            if (!user || !pass) {
                message.innerText = "الرجاء إدخال اسم المستخدم وكلمة المرور!";
                return;
            }

            try {
                const response = await fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo");  
                if (!response.ok) throw new Error("فشل في جلب البيانات من الخادم");

                const users = await response.json();
                const foundUser = users.find(u => u.user === user && u.pass === pass);

                if (foundUser) {
                    localStorage.setItem("loggedInUser", JSON.stringify(foundUser));
                    message.style.color = "green";
                    message.innerText = "تم تسجيل الدخول بنجاح!";
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
                } else {
                    message.style.color = "red";
                    message.innerText = "بيانات تسجيل الدخول غير صحيحة!";
                }
            } catch (error) {
                message.style.color = "red";
                message.innerText = "حدث خطأ أثناء الاتصال بالخادم!";
                console.error("Error:", error);
            }
        }
    </script>

</body>
</html>
