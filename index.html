<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Amiri', sans-serif;
            direction: rtl;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e3d58;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 26px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            background-color: #007FFF;
            padding: 15px 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 18px;
            transition: background-color 0.3s ease;
            border-radius: 5px;
            margin: 0 10px;
        }

        .navbar a:hover {
            background-color: #005b8b;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .content {
            display: none;
            transition: display 0.3s ease;
        }

        .content.active {
            display: block;
        }

        .user-card {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #e6f4ff;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .user-card:hover {
            background-color: #cce0ff;
        }

        .user-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .user-card .info {
            flex-grow: 1;
        }

        .user-card .info .name {
            font-size: 18px;
            font-weight: bold;
            color: #1e3d58;
        }

        .user-card .info .details {
            font-size: 16px;
            color: #3b4e74;
        }

        .button {
            padding: 8px 15px;
            background-color: #007FFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #005b8b;
        }

    </style>
</head>
<body>
    <header>إدارة معلومات المستخدم</header>

    <div class="navbar">
        <a href="#" id="viewButton">عرض المعلومات</a>
        <a href="#" id="editButton">تعديل المعلومات</a>
    </div>

    <div class="container">
        <!-- فورم البحث بين الفورمين -->
        <div id="viewInfo" class="content active">
            <div id="userList">
                <!-- هنا سيتم عرض معلومات المستخدمين -->
            </div>
        </div>

        <!-- تفاصيل المستخدم التي تظهر عند النقر على الاسم أو الصورة -->
        <div id="updateInfo" class="content">
            <form id="updateInfoForm">
                <h3>تعديل المعلومات</h3>

                <!-- محتوى التفاصيل سيُحمل هنا عبر JavaScript -->
            </form>
        </div>
    </div>

    <script>
        // جلب البيانات من الـ API
        async function fetchUserData() {
            try {
                const response = await fetch('https://api.example.com/users'); // استبدال الرابط بعنوان API الخاص بك
                if (!response.ok) {
                    throw new Error('حدث خطأ في جلب البيانات');
                }
                const users = await response.json();
                renderUserList(users); // عرض قائمة المستخدمين
            } catch (error) {
                console.error('فشل جلب البيانات: ', error);
            }
        }

        // عرض قائمة المستخدمين المسترجعة من الـ API
        function renderUserList(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = ''; // مسح أي محتوى موجود

            users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.classList.add('user-card');
                userCard.innerHTML = `
                    <img src="${user.img}" alt="${user.name}">
                    <div class="info">
                        <div class="name">${user.name}</div>
                        <div class="details">${user.stage} | ${user.college}</div>
                    </div>
                    <button class="button" onclick="viewUserDetails(${user.id})">عرض التفاصيل</button>
                `;
                userList.appendChild(userCard);
            });
        }

        // عرض تفاصيل المستخدم عند النقر
        function viewUserDetails(userId) {
            fetchUserDataById(userId).then(user => {
                const updateForm = document.getElementById('updateInfoForm');
                updateForm.innerHTML = `
                    <h3>تفاصيل المستخدم</h3>
                    <img src="${user.profileImage}" alt="${user.name}" style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 15px;">
                    <div><strong>الاسم: </strong>${user.name}</div>
                    <div><strong>المرحلة: </strong>${user.stage}</div>
                    <div><strong>الكلية: </strong>${user.college}</div>
                    <div><strong>القسم: </strong>${user.section}</div>
                    <div><strong>المتوسط في الرياضيات العملية: </strong>${user.mathsPraMid}</div>
                `;
                document.getElementById('viewInfo').classList.remove('active');
                document.getElementById('updateInfo').classList.add('active');
            }).catch(error => {
                console.error('فشل في جلب تفاصيل المستخدم:', error);
            });
        }

        // جلب بيانات المستخدم عبر المعرف
        async function fetchUserDataById(userId) {
            try {
                const response = await fetch(`https://api.example.com/users/${userId}`); // استبدال الرابط بعنوان API الخاص بك
                if (!response.ok) {
                    throw new Error('حدث خطأ في جلب تفاصيل المستخدم');
                }
                const user = await response.json();
                return user;
            } catch (error) {
                throw new Error('فشل جلب تفاصيل المستخدم');
            }
        }

        // أحداث التنقل بين الفورمين
        document.getElementById('viewButton').addEventListener('click', function() {
            document.getElementById('viewInfo').classList.add('active');
            document.getElementById('updateInfo').classList.remove('active');
        });

        document.getElementById('editButton').addEventListener('click', function() {
            document.getElementById('updateInfo').classList.add('active');
            document.getElementById('viewInfo').classList.remove('active');
        });

        // تحميل البيانات عند تحميل الصفحة
        window.onload = fetchUserData;

    </script>
</body>
</html>
