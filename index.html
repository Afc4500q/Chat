<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
            --gradient-bg: linear-gradient(135deg, #2A3F5F 0%, #4A90E2 100%);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 20px;
        }
        .btn-login {
            background: var(--gradient-bg);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div class="login-container" id="loginPage">
        <div class="login-card p-4 bg-white">
            <div class="text-center mb-4">
                <img src="https://via.placeholder.com/100" alt="Logo" class="mb-3" style="border-radius: 50%;">
                <h3>تسجيل الدخول إلى النظام</h3>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label>اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                
                <div class="mb-4">
                    <label>كلمة المرور</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
                
                <div id="loginError" class="text-danger mt-3 text-center" style="display: none;"></div>
            </form>
        </div>
    </div>

    <!-- صفحة لوحة التحكم (مخفية في البداية) -->
    <div id="dashboard" style="display: none;">
        <!-- ... (نفس محتوى لوحة التحكم من الإجابة السابقة) ... -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // عناصر DOM
        const loginPage = document.getElementById('loginPage');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        // معالجة تسجيل الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await axios.get('https://673a394a339a4ce445179ae7.mockapi.io/User');
                const users = response.data;
                
                const foundUser = users.find(user => 
                    user.user === username && 
                    user.pass === password
                );

                if(foundUser) {
                    // تخزين بيانات الجلسة
                    localStorage.setItem('currentUser', JSON.stringify(foundUser));
                    
                    // إخفاء صفحة الدخول وإظهار اللوحة
                    loginPage.style.display = 'none';
                    dashboard.style.display = 'block';
                    
                    // تحميل بيانات اللوحة
                    loadDashboard(foundUser.id);
                } else {
                    showError('بيانات الدخول غير صحيحة');
                }
            } catch (error) {
                showError('حدث خطأ في الاتصال بالخادم');
            }
        });

        function showError(message) {
            loginError.style.display = 'block';
            loginError.textContent = message;
            setTimeout(() => {
                loginError.style.display = 'none';
            }, 3000);
        }

        async function loadDashboard(userId) {
            try {
                const response = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
                const userData = response.data;
                
                // ... (نفس كود عرض لوحة التحكم من الإجابة السابقة) ...
            } catch (error) {
                console.error('حدث خطأ في جلب البيانات:', error);
            }
        }

        // التحقق من وجود جلسة مسجلة
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if(currentUser) {
            loginPage.style.display = 'none';
            dashboard.style.display = 'block';
            loadDashboard(currentUser.id);
        }
    </script>
</body>
</html>
