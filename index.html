<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            background: #f4f4f4;
            padding: 50px;
        }
        .login-container {
            max-width: 300px;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            display: block;
        }
        button {
            padding: 10px;
            width: 100%;
            background: #2A9D8F;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="loginUser()">تسجيل الدخول</button>
    </div>

    <script>
    async function loginUser() {
        try {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo");
            const users = await response.json();

            // البحث عن المستخدم باستخدام `user` و `pass`
            const user = users.find(u => u.user === username && u.pass === password);
            if (!user) {
                alert("خطأ في تسجيل الدخول. تأكد من اسم المستخدم وكلمة المرور.");
                return;
            }

            // تخزين `id` الخاص بالمستخدم في localStorage
            localStorage.setItem("loggedInUserId", user.id);
            window.location.href = "dashboard.html"; // الانتقال إلى لوحة التحكم
        } catch (error) {
            console.error("خطأ أثناء تسجيل الدخول:", error);
        }
    }
</script>

</body>
</html>
