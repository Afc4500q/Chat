<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
            --gradient-bg: linear-gradient(135deg, #2A3F5F 0%, #4A90E2 100%);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .dashboard-page {
            display: none; /* سيتم إظهاره عبر الجافاسكريبت */
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div class="login-container" id="loginPage">
        <div class="login-card p-4 bg-white">
            <form id="loginForm">
                <div class="text-center mb-4">
                    <h3>تسجيل الدخول</h3>
                </div>
                <div class="mb-3">
                    <label>اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-4">
                    <label>كلمة المرور</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
                <div id="loginError" class="text-danger mt-3 text-center"></div>
            </form>
        </div>
    </div>

    <!-- صفحة لوحة التحكم -->
    <div class="container-fluid py-4 dashboard-page" id="dashboard">
        <!-- ... (نفس محتوى لوحة التحكم السابق) ... -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // ============= إصلاح المشكلة الرئيسية =============
        const loginPage = document.getElementById('loginPage');
        const dashboard = document.getElementById('dashboard');
        
        // تحميل أولي للبيانات
        checkAuth();

        async function checkAuth() {
            const user = localStorage.getItem('currentUser');
            if(user) {
                loginPage.style.display = 'none';
                dashboard.style.display = 'block';
                loadDashboard(JSON.parse(user).id);
            }
        }

        // معالجة تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await axios.get('https://673a394a339a4ce445179ae7.mockapi.io/User');
                const user = response.data.find(u => u.user === username && u.pass === password);
                
                if(user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    loginPage.style.display = 'none';
                    dashboard.style.display = 'block';
                    loadDashboard(user.id); // إصلاح هنا: استخدام user.id مباشرة
                } else {
                    showError('بيانات الدخول غير صحيحة');
                }
            } catch (error) {
                showError('حدث خطأ في الاتصال بالخادم');
            }
        });

        // ... (بقية الدوال كما هي) ...

        // ============= إصلاحات إضافية =============
        function showError(msg) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 3000);
        }

        async function loadDashboard(userId) {
            try {
                const response = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
                const userData = response.data;
                
                // ... (نفس كود عرض البيانات السابق) ...
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                logout();
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.reload();
        }
    </script>
</body>
</html>
