<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        /* نفس التنسيق السابق كما هو */
    </style>
</head>
<body>
    <header>إدارة معلومات المستخدم</header>

    <div class="navbar">
        <a href="#" id="viewButton">عرض المعلومات</a>
        <a href="#" id="editButton">تعديل المعلومات</a>
    </div>

    <div class="container">
        <div id="viewInfo" class="content active">
            <div id="userList">
                <!-- هنا سيتم عرض قائمة المستخدمين -->
            </div>
        </div>

        <div id="updateInfo" class="content">
            <form id="updateInfoForm">
                <h3>تعديل المعلومات</h3>
            </form>
        </div>
    </div>

    <script>
        // جلب البيانات من API
        async function fetchUserData() {
            try {
                const response = await fetch('https://679353885eae7e5c4d8e46e3.mockapi.io/Users'); 
                const users = await response.json();
                renderUserList(users);
            } catch (error) {
                console.error('فشل جلب البيانات: ', error);
            }
        }

        // عرض قائمة المستخدمين
        function renderUserList(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.classList.add('user-card');
                userCard.innerHTML = `
                    <img src="${user.img}" alt="${user.name}">
                    <div class="info">
                        <div class="name">${user.name}</div>
                        <div class="details">${user.stage} | ${user.college}</div>
                    </div>
                    <a class="button" href="bord.html?userId=${user.id}">عرض التفاصيل</a>
                `;
                userList.appendChild(userCard);
            });
        }

        window.onload = fetchUserData;
    </script>
</body>
</html>
