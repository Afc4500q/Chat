<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0b132b; /* خلفية ليلية داكنة */
            font-family: 'Tajawal', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: white;
        }
        .login-card {
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            color: white;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1c2541 0%, #3a506b 100%);
        }
        
        /* تأثير اسم البوارق */
        .brand {
            font-size: 50px;
            font-weight: bold;
            color: #ffdd57;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            animation: float 2s infinite alternate;
        }
        .brand i {
            font-size: 60px;
            color: #ffdd57;
            animation: bounce 1.5s infinite alternate;
        }

        /* حركة الاهتزاز */
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* تأثير النجوم */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 0 0 5px white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* تأثير الثلوج المتساقطة */
        .snow {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center">
    
    <!-- النجوم -->
    <div class="stars"></div>
    
    <!-- شعار البوارق مع الحركة -->
    <div class="brand">
        <i class="fas fa-truck-fast"></i>
        <span>البوارق</span>
    </div>

    <!-- بطاقة تسجيل الدخول -->
    <div class="container">
        <div class="login-card card mx-auto p-4">
            <div class="card-header gradient-bg text-white">
                <h4 class="mb-0 text-center">تسجيل الدخول</h4>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label>اسم المستخدم</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-4">
                        <label>كلمة المرور</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <i class="fas fa-sign-in-alt"></i> دخول
                    </button>
                    <div id="loginError" class="text-danger mt-3 text-center"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- تأثير الثلوج -->
    <div class="snow"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://673a394a339a4ce445179ae7.mockapi.io/User');
                const data = await response.json();
                const user = data.find(u => u.user === username && u.pass === password);
                
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'dashboard.html';
                } else {
                    showError('بيانات الدخول غير صحيحة');
                }
            } catch (error) {
                showError('حدث خطأ في الاتصال بالخادم');
            }
        });

        function showError(msg) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 3000);
        }

        // إنشاء النجوم العشوائية
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 50; i++) {
            let star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // إنشاء الثلوج العشوائية
        const snowContainer = document.querySelector('.snow');
        for (let i = 0; i < 30; i++) {
            let snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 5 + 3 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(snowflake);
        }
    </script>
</body>
</html>
