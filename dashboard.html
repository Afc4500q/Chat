<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2A9D8F;
            --secondary-color: #264653;
            --accent-color: #E9C46A;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info i {
            font-size: 32px;
            color: var(--accent-color);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
        }

        .toggle-request {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .toggle-request:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background-color: red;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box i {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .products {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="name">اسم المستخدم</h2>
                <p id="userEmail">البريد الإلكتروني</p>
            </div>
            <div class="user-controls">
                <button id="toggleRequestBtn" class="toggle-request">
                    لا يوجد طلب <span class="status-indicator" id="requestIndicator"></span>
                </button>
            </div>
        </div>

        <div class="stats">
            

             <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrdersElement">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="requestIndicator">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>
            
            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>
        </div>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const toggleRequestBtn = document.getElementById("toggleRequestBtn");
            const requestIndicator = document.getElementById("requestIndicator");
            const userNameElement = document.getElementById("name");
            const userEmailElement = document.getElementById("user");
            const totalOrdersElement = document.getElementById("totalOrders");
            const successfulOrdersElement = document.getElementById("successfulOrders");
            const productListElement = document.getElementById("productList");

            try {
                const response = await fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo");
                const data = await response.json();

                if (data.length === 0) {
                    console.error("لم يتم العثور على بيانات");
                    return;
                }

                // استخراج أول مستخدم (يمكن تعديله حسب الحاجة)
                const user = data[0];

                // تحديث معلومات المستخدم
                toggleRequestBtn.textContent = user.toggleRequestBtn || "اسم غير متوفر";
                requestIndicator.textContent = user.requestIndicator || "اسم غير متوفر";
                userNameElement.textContent = user.name || "اسم غير متوفر";
                totalOrdersElement.textContent = user.totalOrders || "اسم غير متوفر";
                successfulOrdersElement.textContent = user.successfulOrders || "اسم غير متوفر";
                productListElement.textContent = user.productList || "اسم غير متوفر";
                userEmailElement.textContent = user.user || "بريد غير متوفر";
                updateButtonUI(user.type_user);

                // تحديث أزرار الطلب
                toggleRequestBtn.addEventListener("click", async () => {
                    const newStatus = !user.type_user;
                    await updateRequestStatus(user.id, newStatus);
                    user.type_user = newStatus;
                    updateButtonUI(newStatus);
                });

                // تحديث الإحصائيات
                totalOrdersElement.textContent = data.length;
                successfulOrdersElement.textContent = data.filter(item => item.type_user).length;

                // عرض المنتجات
                productListElement.innerHTML = data.map(product => `
                    <div class="product-item">
                        <strong>${product.name || "منتج غير معروف"}</strong> - 
                        <span>${product.price || "سعر غير متوفر"}$</span>
                    </div>
                `).join("");

            } catch (error) {
                console.error("حدث خطأ أثناء جلب البيانات:", error);
            }

            async function updateRequestStatus(userId, newStatus) {
                await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type_user: newStatus })
                });
            }

            function updateButtonUI(status) {
                toggleRequestBtn.textContent = status ? "إلغاء الطلب" : "لا يوجد طلب";
                requestIndicator.style.backgroundColor = status ? "green" : "red";
            }
        });
    </script>

</body>
</html>
