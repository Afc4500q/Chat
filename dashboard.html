<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary: #2A9D8F;
    --secondary: #16202B;
    --accent: #E9C46A;
    --text: #E0F2FE;
    --border: rgba(255,255,255,0.1);
    --background: #0F1720;
}

body {
    font-family: 'Cairo', sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    gap: 2rem;
}

/* تنسيقات بطاقة المستخدم */
.user-info {
    background: var(--secondary);
    border-radius: 1rem;
    padding: 2rem;
    display: flex;
    gap: 2rem;
    align-items: center;
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
}

.user-info i {
    background: rgba(42, 157, 143, 0.2);
    padding: 1.5rem;
    border-radius: 50%;
    font-size: 2.5rem;
    color: var(--primary);
}

.user-info h2 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
}

.user-info p {
    color: rgba(224, 242, 254, 0.9);
    display: flex;
    align-items: center;
    gap: 0.8rem;
}

/* تنسيقات الإحصائيات */
.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* عمودين في كل سطر */
    gap: 1.5rem;
}



.stat-box {
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.5rem;
    text-align: center;
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column; /* ترتيب العناصر عمودياً */
    align-items: center; /* توسيط العناصر أفقياً */
    justify-content: center; /* توسيط العناصر عمودياً */
}

.stat-box:hover {
    transform: translateY(-5px);
}

.stat-box i {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 0.5rem; /* تقليل الهامش السفلي */
}

.stat-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
}

/* تنسيقات المنتجات */
.products {
    background: var(--secondary);
    border-radius: 1rem;
    padding: 2rem;
    border: 1px solid var(--border);
}

.products h3 {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.product-item {
    background: rgba(255,255,255,0.03);
    border-left: 4px solid var(--primary);
    border-radius: 0.5rem;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: all 0.2s ease;
}

.product-item:hover {
    background: rgba(255,255,255,0.05);
    transform: translateX(10px);
}

.product-item p {
    margin: 0.5rem 0;
    color: rgba(224, 242, 254, 0.9);
}

/* تنسيقات الأزرار */
.toggle-request {
    background: linear-gradient(45deg, var(--primary), #238C7F);
    border: none;
    padding: 1rem 2rem;
    border-radius: 0.8rem;
    font-size: 1.1rem;
    font-weight: 600;
    transition: all 0.2s ease;
}

.toggle-request:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
}

.edit-btn {
    background: rgba(233, 196, 106, 0.15);
    color: var(--accent);
    border: 1px solid rgba(233, 196, 106, 0.3);
}

.delete-btn {
    background: rgba(231, 111, 81, 0.15);
    color: #E76F51;
    border: 1px solid rgba(231, 111, 81, 0.3);
}

/* التجاوب للشاشات الصغيرة */
@media (max-width: 768px) {
    .user-info {
        flex-direction: column;
        text-align: center;
    }
    
    .stats {
        grid-template-columns: 1fr;
    }
    
    .product-item {
        padding: 1rem;
    }
}

/* تأثيرات خاصة */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.product-item {
    animation: fadeIn 0.5s ease forwards;
}

</style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    const API_URL = `https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`;
    let userData = null;

    // تحميل البيانات الأولية
    async function loadUserData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            userData = await response.json();
            userData.products = userData.products?.map(p => ({ ...p, isEditing: false })) || [];
            updateUI();
        } catch (error) {
            showError(error.message);
        }
    }

    // تحديث الواجهة
    function updateUI() {
        elements.userName.textContent = userData.user || "مستخدم غير معروف";
        elements.userBalance.textContent = `رصيد: ${userData.balance || 0} $`;
        elements.userEmail.innerHTML = `<span class="material-icons-round">email</span> ${userData.email || "بريد غير متوفر"}`;
        
        elements.totalOrders.textContent = userData.totalOrders || 0;
        elements.successfulOrders.textContent = userData.successfulOrders || 0;
        elements.pendingOrders.textContent = userData.pendingOrders || 0;
        elements.canceledOrders.textContent = userData.rejectedOrders || 0;

        renderProducts();
        setupEventListeners();
        updateRequestButton(userData.type_user);
    }

    // عرض المنتجات
    function renderProducts() {
        elements.productList.innerHTML = userData.products.length > 0 
            ? userData.products.map((product, index) => `
                <div class="product-item" data-index="${index}">
                    <div class="product-header">
                        <span class="product-id">#${product.id}</span>
                        <span class="product-status">${product.status}</span>
                    </div>
                    ${product.isEditing ? getEditableFields(product, index) : getStaticFields(product)}
                    <div class="product-actions">
                        <button class="edit-btn">${product.isEditing ? 'حفظ التغييرات' : 'تعديل'}</button>
                        <button class="delete-btn">حذف المنتج</button>
                    </div>
                </div>
            `).join("")
            : `<div class="no-products">لا توجد منتجات متاحة</div>`;
    }

    // الحقول الثابتة
    function getStaticFields(product) {
        return `
            <div class="product-details">
                <p><strong>الاسم:</strong> ${product.name}</p>
                <p><strong>السعر:</strong> ${product.price}$</p>
                <p><strong>الموقع:</strong> ${[product.state, product.city, product.area].filter(Boolean).join(' - ')}</p>
                <p><strong>النوع:</strong> ${product.type}</p>
            </div>
        `;
    }

    // الحقول القابلة للتعديل
    function getEditableFields(product, index) {
        return `
            <div class="product-form">
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="name-${index}" value="${product.name}" required>
                </div>
                <div class="form-group">
                    <label>السعر ($):</label>
                    <input type="number" id="price-${index}" value="${product.price}" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="state-${index}" value="${product.state}">
                </div>
                <div class="form-group">
                    <label>المدينة:</label>
                    <input type="text" id="city-${index}" value="${product.city}">
                </div>
                <div class="form-group">
                    <label>المنطقة:</label>
                    <input type="text" id="area-${index}" value="${product.area}">
                </div>
                <div class="form-group">
                    <label>النوع:</label>
                    <input type="text" id="type-${index}" value="${product.type}">
                </div>
            </div>
        `;
    }

    // إعداد مستمعي الأحداث
    function setupEventListeners() {
        document.querySelectorAll('.edit-btn').forEach((btn, index) => {
            btn.addEventListener('click', async () => {
                const product = userData.products[index];
                if (product.isEditing) {
                    await handleSave(index);
                } else {
                    enterEditMode(index);
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach((btn, index) => {
            btn.addEventListener('click', () => handleDelete(index));
        });
    }

    // تفعيل وضع التعديل
    function enterEditMode(index) {
        userData.products[index].isEditing = true;
        updateUI();
        setTimeout(() => {
            const firstInput = document.querySelector(`#name-${index}`);
            if (firstInput) firstInput.focus();
        }, 100);
    }

    // معالجة الحفظ
    async function handleSave(index) {
        if (!validateInputs(index)) return;

        userData.products[index] = {
            ...userData.products[index],
            name: document.getElementById(`name-${index}`).value,
            price: parseFloat(document.getElementById(`price-${index}`).value),
            state: document.getElementById(`state-${index}`).value,
            city: document.getElementById(`city-${index}`).value,
            area: document.getElementById(`area-${index}`).value,
            type: document.getElementById(`type-${index}`).value,
            isEditing: false
        };

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحفظ');
            await loadUserData();
            showSuccess('تم حفظ التغييرات بنجاح');
        } catch (error) {
            showError(error.message);
            userData.products[index].isEditing = true;
            updateUI();
        }
    }

    // التحقق من صحة المدخلات
    function validateInputs(index) {
        let isValid = true;
        const requiredFields = [
            { id: `name-${index}`, message: 'حقل الاسم مطلوب' },
            { id: `price-${index}`, message: 'حقل السعر مطلوب' }
        ];

        requiredFields.forEach(({ id, message }) => {
            const input = document.getElementById(id);
            if (!input.value.trim()) {
                input.classList.add('invalid');
                isValid = false;
                showError(message);
            } else {
                input.classList.remove('invalid');
            }
        });

        return isValid;
    }

    // معالجة الحذف
    async function handleDelete(index) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

        try {
            userData.products.splice(index, 1);
            
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحذف');
            await loadUserData();
            showSuccess('تم حذف المنتج بنجاح');
        } catch (error) {
            showError(error.message);
            await loadUserData();
        }
    }

    // إدارة النتائج
    function showSuccess(message) {
        alert(message);
    }

    function showError(message) {
        alert(`خطأ: ${message}`);
    }

    // التهيئة الأولية
    await loadUserData();
    elements.requestButton.addEventListener("click", () => {
        window.location.href = "new-request.html";
    });

    function updateRequestButton(userType) {
        if (userType === 'admin') {
            elements.requestButton.style.display = 'none';
        }
    }
});
    </script>  
</body>
</html>
