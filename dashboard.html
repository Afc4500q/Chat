<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary-color: #2A9D8F;
    --secondary-color: #264653;
    --accent-color: #E9C46A;
    --text-color: #ffffff;
    --glass-effect: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
}

body {
    background: radial-gradient(circle at top right, #264653 0%, #1a2f38 100%);
}

.container {
    max-width: 1200px;
    padding: 40px 20px;
}

.user-info {
    background: var(--glass-effect);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
}

.user-info::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg);
    pointer-events: none;
}

.user-info i {
    background: var(--glass-effect);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 20px;
    font-size: 48px;
}

.stats {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.stat-box {
    background: var(--glass-effect);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 15px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
}

.stat-box i {
    font-size: 40px;
    background: linear-gradient(45deg, var(--accent-color), #f4a261);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.products {
    background: var(--glass-effect);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
}

.product-item {
    background: rgba(0, 0, 0, 0.15);
    border-left: 4px solid var(--accent-color);
    transition: all 0.3s ease;
}

.product-item:hover {
    transform: translateX(15px);
    background: rgba(0, 0, 0, 0.2);
}

.toggle-request {
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.toggle-request::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: rotate(45deg);
    transition: 0.4s;
}

.toggle-request:hover::after {
    animation: shine 1.5s;
}

@keyframes shine {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
}

.product-form .form-group {
    margin-bottom: 20px;
}

.product-form input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    width: 100%;
    transition: all 0.3s ease;
}

.product-form input:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(233, 196, 106, 0.2);
}

.edit-btn {
    background: linear-gradient(45deg, var(--accent-color), #f4a261);
}

.delete-btn {
    background: linear-gradient(45deg, #e76f51, #d94830);
}

@media (max-width: 768px) {
    .user-info {
        flex-direction: column;
        text-align: center;
    }
    
    .stats {
        grid-template-columns: 1fr 1fr;
    }
    
    .product-item {
        padding: 15px;
    }
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.floating-icon {
    animation: float 3s ease-in-out infinite;
}
</style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    const API_URL = `https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`;
    let userData = null;

    // تحميل البيانات الأولية
    async function loadUserData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            userData = await response.json();
            userData.products = userData.products?.map(p => ({ ...p, isEditing: false })) || [];
            updateUI();
        } catch (error) {
            showError(error.message);
        }
    }

    // تحديث الواجهة
    function updateUI() {
        elements.userName.textContent = userData.user || "مستخدم غير معروف";
        elements.userBalance.textContent = `رصيد: ${userData.balance || 0} $`;
        elements.userEmail.innerHTML = `<span class="material-icons-round">email</span> ${userData.email || "بريد غير متوفر"}`;
        
        elements.totalOrders.textContent = userData.totalOrders || 0;
        elements.successfulOrders.textContent = userData.successfulOrders || 0;
        elements.pendingOrders.textContent = userData.pendingOrders || 0;
        elements.canceledOrders.textContent = userData.rejectedOrders || 0;

        renderProducts();
        setupEventListeners();
        updateRequestButton(userData.type_user);
    }

    // عرض المنتجات
    function renderProducts() {
        elements.productList.innerHTML = userData.products.length > 0 
            ? userData.products.map((product, index) => `
                <div class="product-item" data-index="${index}">
                    <div class="product-header">
                        <span class="product-id">#${product.id}</span>
                        <span class="product-status">${product.status}</span>
                    </div>
                    ${product.isEditing ? getEditableFields(product, index) : getStaticFields(product)}
                    <div class="product-actions">
                        <button class="edit-btn">${product.isEditing ? 'حفظ التغييرات' : 'تعديل'}</button>
                        <button class="delete-btn">حذف المنتج</button>
                    </div>
                </div>
            `).join("")
            : `<div class="no-products">لا توجد منتجات متاحة</div>`;
    }

    // الحقول الثابتة
    function getStaticFields(product) {
        return `
            <div class="product-details">
                <p><strong>الاسم:</strong> ${product.name}</p>
                <p><strong>السعر:</strong> ${product.price}$</p>
                <p><strong>الموقع:</strong> ${[product.state, product.city, product.area].filter(Boolean).join(' - ')}</p>
                <p><strong>النوع:</strong> ${product.type}</p>
            </div>
        `;
    }

    // الحقول القابلة للتعديل
    function getEditableFields(product, index) {
        return `
            <div class="product-form">
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="name-${index}" value="${product.name}" required>
                </div>
                <div class="form-group">
                    <label>السعر ($):</label>
                    <input type="number" id="price-${index}" value="${product.price}" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="state-${index}" value="${product.state}">
                </div>
                <div class="form-group">
                    <label>المدينة:</label>
                    <input type="text" id="city-${index}" value="${product.city}">
                </div>
                <div class="form-group">
                    <label>المنطقة:</label>
                    <input type="text" id="area-${index}" value="${product.area}">
                </div>
                <div class="form-group">
                    <label>النوع:</label>
                    <input type="text" id="type-${index}" value="${product.type}">
                </div>
            </div>
        `;
    }

    // إعداد مستمعي الأحداث
    function setupEventListeners() {
        document.querySelectorAll('.edit-btn').forEach((btn, index) => {
            btn.addEventListener('click', async () => {
                const product = userData.products[index];
                if (product.isEditing) {
                    await handleSave(index);
                } else {
                    enterEditMode(index);
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach((btn, index) => {
            btn.addEventListener('click', () => handleDelete(index));
        });
    }

    // تفعيل وضع التعديل
    function enterEditMode(index) {
        userData.products[index].isEditing = true;
        updateUI();
        setTimeout(() => {
            const firstInput = document.querySelector(`#name-${index}`);
            if (firstInput) firstInput.focus();
        }, 100);
    }

    // معالجة الحفظ
    async function handleSave(index) {
        if (!validateInputs(index)) return;

        userData.products[index] = {
            ...userData.products[index],
            name: document.getElementById(`name-${index}`).value,
            price: parseFloat(document.getElementById(`price-${index}`).value),
            state: document.getElementById(`state-${index}`).value,
            city: document.getElementById(`city-${index}`).value,
            area: document.getElementById(`area-${index}`).value,
            type: document.getElementById(`type-${index}`).value,
            isEditing: false
        };

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحفظ');
            await loadUserData();
            showSuccess('تم حفظ التغييرات بنجاح');
        } catch (error) {
            showError(error.message);
            userData.products[index].isEditing = true;
            updateUI();
        }
    }

    // التحقق من صحة المدخلات
    function validateInputs(index) {
        let isValid = true;
        const requiredFields = [
            { id: `name-${index}`, message: 'حقل الاسم مطلوب' },
            { id: `price-${index}`, message: 'حقل السعر مطلوب' }
        ];

        requiredFields.forEach(({ id, message }) => {
            const input = document.getElementById(id);
            if (!input.value.trim()) {
                input.classList.add('invalid');
                isValid = false;
                showError(message);
            } else {
                input.classList.remove('invalid');
            }
        });

        return isValid;
    }

    // معالجة الحذف
    async function handleDelete(index) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

        try {
            userData.products.splice(index, 1);
            
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحذف');
            await loadUserData();
            showSuccess('تم حذف المنتج بنجاح');
        } catch (error) {
            showError(error.message);
            await loadUserData();
        }
    }

    // إدارة النتائج
    function showSuccess(message) {
        alert(message);
    }

    function showError(message) {
        alert(`خطأ: ${message}`);
    }

    // التهيئة الأولية
    await loadUserData();
    elements.requestButton.addEventListener("click", () => {
        window.location.href = "new-request.html";
    });

    function updateRequestButton(userType) {
        if (userType === 'admin') {
            elements.requestButton.style.display = 'none';
        }
    }
});
    </script>  
</body>
</html>
