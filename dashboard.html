<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .stat-card {
            border-left: 4px solid var(--secondary-color);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .product-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>

        <!-- معلومات المستخدم -->
        <div class="row mb-4" id="user-info"></div>

        <!-- الإحصائيات -->
        <div class="row row-cols-2 mb-4" id="stats"></div>

        <!-- المنتجات -->
        <div class="row" id="products-list"></div>
    </div>

    <!-- نموذج التعديل -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المنتج</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label>اسم المنتج</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>السعر</label>
                            <input type="number" id="editPrice" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>المنطقة</label>
                            <input type="text" id="editRegion" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>المدينة</label>
                            <input type="text" id="editCity" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الولاية</label>
                            <input type="text" id="editState" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الهاتف</label>
                            <input type="tel" id="editPhone" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // التحقق من الجلسة
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = 'login.html';

        // تحميل البيانات
        async function loadDashboard() {
            try {
                const { data } = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                
                // معلومات المستخدم
                document.getElementById('user-info').innerHTML = `
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <h5><i class="fas fa-user text-primary"></i> الاسم</h5>
                                <h2>${data.name}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <h5><i class="fas fa-at text-success"></i> اسم المستخدم</h5>
                                <h2>${data.user}</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <h5><i class="fas fa-wallet text-danger"></i> الرصيد</h5>
                                <h2>${data.total} IQD</h2>
                            </div>
                        </div>
                    </div>
                `;

                // الإحصائيات
                document.getElementById('stats').innerHTML = `
                    <div class="col mb-3">
                        <div class="card bg-primary text-white h-100">
                            <div class="card-body">
                                <h5>الطلبات الكلية</h5>
                                <h1>${data.total}</h1>
                            </div>
                        </div>
                    </div>
                    <div class="col mb-3">
                        <div class="card bg-success text-white h-100">
                            <div class="card-body">
                                <h5>الطلبات الناجحة</h5>
                                <h1>${data.successful}</h1>
                            </div>
                        </div>
                    </div>
                    <div class="col mb-3">
                        <div class="card bg-warning text-white h-100">
                            <div class="card-body">
                                <h5>الطلبات المعلقة</h5>
                                <h1>${data.pending}</h1>
                            </div>
                        </div>
                    </div>
                    <div class="col mb-3">
                        <div class="card bg-danger text-white h-100">
                            <div class="card-body">
                                <h5>الطلبات المرفوضة</h5>
                                <h1>${data.rejected}</h1>
                            </div>
                        </div>
                    </div>
                `;

                // المنتجات
                const productsHTML = data.products.map(product => `
                    <div class="col-md-4 mb-3">
                        <div class="card product-card h-100">
                            <div class="card-body">
                                <h5><i class="fas fa-cube"></i> ${product.name}</h5>
                                <div class="row">
                                    <div class="col-6">
                                        <small>السعر: ${product.price} IQD</small>
                                    </div>
                                    <div class="col-6">
                                        <span class="badge bg-${getStatusColor(product.status)}">
                                            ${product.status}
                                        </span>
                                    </div>
                                    <div class="col-12 mt-2">
                                        <small><i class="fas fa-id-badge"></i> ID: ${product.id}</small>
                                    </div>
                                    <div class="col-12 mt-2">
                                        <small><i class="fas fa-map-marker-alt"></i> المنطقة: ${product.region || 'غير متوفر'}</small>
                                    </div>
                                    <div class="col-12">
                                        <small><i class="fas fa-city"></i> المدينة: ${product.city || 'غير متوفر'}</small>
                                    </div>
                                    <div class="col-12">
                                        <small><i class="fas fa-flag"></i> الولاية: ${product.state || 'غير متوفر'}</small>
                                    </div>
                                    <div class="col-12">
                                        <small><i class="fas fa-phone"></i> ${product.phone || 'غير متوفر'}</small>
                                    </div>
                                    <div class="d-flex gap-2 mt-3">
                                        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">
                                            <i class="fas fa-trash"></i> حذف
                                        </button>
                                        <button class="btn btn-primary btn-sm" onclick="openEditModal('${product.id}')">
                                            <i class="fas fa-edit"></i> تعديل
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('products-list').innerHTML = productsHTML;

            } catch (error) {
                console.error('حدث خطأ:', error);
                alert('تعذر تحميل البيانات');
                logout();
            }
        }

        function getStatusColor(status) {
            const colors = {
                'قيد المراجعة': 'warning',
                'مكتمل': 'success',
                'مرفوض': 'danger'
            };
            return colors[status] || 'secondary';
        }

        async function deleteProduct(productId) {
            if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            
            try {
                // طريقة الحذف المباشر
                await axios.delete(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}/products/${productId}`);
                
                // طريقة بديلة إذا لم تعمل الأولى
                // const userRes = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                // const updatedProducts = userRes.data.products.filter(p => p.id !== productId);
                // await axios.put(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {products: updatedProducts});
                
                loadDashboard();
                alert('تم الحذف بنجاح!');
            } catch (error) {
                console.error('حدث خطأ أثناء الحذف:', error);
                alert('فشل في الحذف!');
            }
        }

        function openEditModal(productId) {
            const product = currentUser.products.find(p => p.id === productId);
            if(!product) return;
            
            document.getElementById('editProductId').value = productId;
            document.getElementById('editName').value = product.name;
            document.getElementById('editPrice').value = product.price;
            document.getElementById('editRegion').value = product.region || '';
            document.getElementById('editCity').value = product.city || '';
            document.getElementById('editState').value = product.state || '';
            document.getElementById('editPhone').value = product.phone || '';
            
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveChanges() {
            const productId = document.getElementById('editProductId').value;
            const updatedData = {
                name: document.getElementById('editName').value,
                price: document.getElementById('editPrice').value,
                region: document.getElementById('editRegion').value,
                city: document.getElementById('editCity').value,
                state: document.getElementById('editState').value,
                phone: document.getElementById('editPhone').value
            };

            try {
                // طريقة التحديث المباشر
                await axios.put(
                    `https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}/products/${productId}`,
                    updatedData
                );

                // طريقة بديلة إذا لم تعمل الأولى
                  const userRes = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                 const updatedProducts = userRes.data.products.map(p => 
                   p.id === productId ? {...p, ...updatedData} : p
                );
               await axios.put(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {products: updatedProducts});

                loadDashboard();
                new bootstrap.Modal(document.getElementById('editModal')).hide();
                alert('تم التحديث بنجاح!');
            } catch (error) {
                console.error('حدث خطأ أثناء التحديث:', error);
                alert('فشل في التحديث!');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        // تحميل البيانات عند بدء التشغيل
        loadDashboard();
    </script>
</body>
</html>
