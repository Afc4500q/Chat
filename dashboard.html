 <!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2A9D8F;
            --secondary-color: #264653;
            --accent-color: #E9C46A;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info i {
            font-size: 32px;
            color: var(--accent-color);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
        }

        .toggle-request {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .toggle-request:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background-color: red;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box i {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .products {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userEmail">البريد الإلكتروني</p>
            </div>
            <div class="user-controls">
                <button id="toggleRequestBtn" class="toggle-request">
                    لا يوجد طلب <span class="status-indicator" id="requestStatus"></span>
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const elements = {
                toggleBtn: document.getElementById("toggleRequestBtn"),
                statusIndicator: document.getElementById("requestStatus"),
                userName: document.getElementById("userName"),
                userEmail: document.getElementById("userEmail"),
                totalOrders: document.getElementById("totalOrders"),
                successfulOrders: document.getElementById("successfulOrders"),
                productList: document.getElementById("productList")
            };

            try {
                const response = await fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo");
                if (!response.ok) throw new Error('فشل جلب البيانات');
                const data = await response.json();

                if (!data.length) {
                    console.error("لم يتم العثور على بيانات");
                    return;
                }

                // تحديث واجهة المستخدم
                updateUI(data);

                // إعداد الأحداث
                elements.toggleBtn.addEventListener("click", () => toggleRequestStatus(data[0].id));

            } catch (error) {
                console.error("حدث خطأ أثناء جلب البيانات:", error);
                elements.productList.innerHTML = `<div class="product-item">خطأ في تحميل البيانات</div>`;
            }

            function updateUI(data) {
                const user = data[0];
                elements.userName.textContent = user.name || "مستخدم غير معروف";
                elements.userEmail.textContent = user.email || "بريد غير متوفر";
                elements.totalOrders.textContent = user.totalOrders;
                elements.successfulOrders.textContent = user.successfulOrders(item => item.status === 'completed').length;

                elements.productList.innerHTML = products.map(product => `
                    <div class="product-item">
                        <strong>${product.name || "منتج غير معروف"}</strong>
                        <span>${product.price ? `${product.price}$` : "سعر غير متوفر"}</span>
                    </div>
                `).join("");
            }

            async function toggleRequestStatus(userId) {
                try {
                    const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status: 'pending' })
                    });
                    
                    if (!response.ok) throw new Error('فشل تحديث الحالة');
                    const updatedData = await response.json();
                    updateUI([updatedData]);
                    
                } catch (error) {
                    console.error("حدث خطأ أثناء تحديث الحالة:", error);
                }
            }
        });
    </script>

</body>
</html>
