<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* CSS المحدث */
        :root {
            --primary-color: #2A9D8F;
            --secondary-color: #264653;
            --accent-color: #E9C46A;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info i {
            font-size: 40px;
            color: var(--accent-color);
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        .user-info h2 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            font-weight: bold; /* إضافة bold للاسم */
        }

        .user-info p {
            margin: 0;
            font-size: 0.95rem;
            font-weight: bold; /* إضافة bold للرصيد */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* بقية الـ CSS كما هي */
        /* ... */
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <!-- تغيير البريد الإلكتروني إلى الرصيد -->
                <p id="userBalance">الرصيد: 0 دينار</p>
            </div>
        </div>

        <!-- بقية العناصر كما هي -->
        <!-- ... -->

        <button id="requestButton" class="toggle-request">
            لا يوجد طلب
        </button>

        <!-- ... -->
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const elements = {
                userName: document.getElementById("userName"),
                userBalance: document.getElementById("userBalance"), // تغيير الـ ID
                // ... بقية العناصر
            };

            // ... الكود السابق

            function updateUI(user) {
                elements.userName.textContent = user.user || "مستخدم غير معروف";
                elements.userBalance.textContent = `الرصيد: ${user.balance || 0} دينار`; // تحديث الرصيد
                // ... بقية التحديثات
            }

            // تعديل الحدث لفتح صفحة جديدة
            elements.requestButton.addEventListener("click", () => {
                window.location.href = 'الرابط-الجديد.html'; // استبدل بالرابط المطلوب
            });

            // إزالة الدوال المتعلقة بـ type_user
        });
    </script>
</body>
</html>
