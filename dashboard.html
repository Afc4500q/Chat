<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* ... الأنماط السابقة تبقى كما هي ... */

        /* أنماط جديدة للأزرار */
        .user-actions {
            margin-right: auto;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .request-button {
            position: relative;
            padding: 8px 20px;
            border: none;
            border-radius: 25px;
            background-color: #ff4444;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .request-button.active {
            background-color: #00C851;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: white;
            transition: all 0.3s ease;
        }

        .request-button.active .status-indicator {
            background-color: #007E33;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <div class="user-actions">
                <button class="request-button" id="requestButton" onclick="toggleRequest()">
                    <span>لا يوجد طلب</span>
                    <span class="status-indicator"></span>
                </button>
            </div>
            
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p>مرحبًا بك في لوحة التحكم</p>
            </div>
        </div>

        <!-- ... بقية العناصر كما هي ... -->
    </div>

    <script>
        // تحديث الدالة الرئيسية
        document.addEventListener("DOMContentLoaded", async () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) window.location.href = "login.html";

            // جلب بيانات المستخدم الحالية من API
            const users = await fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo").then(res => res.json());
            currentUser = users.find(u => u.user === user.user && u.pass === user.pass);
            
            // تحديث حالة الزر
            updateRequestButton(currentUser.type_user);

            // ... بقية الكود السابق ...
        });

        // دالة تبديل حالة الطلب
        async function toggleRequest() {
            const button = document.getElementById('requestButton');
            const isActive = button.classList.contains('active');
            
            try {
                const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${currentUser.id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type_user: !isActive
                    })
                });

                if (response.ok) {
                    currentUser = await response.json();
                    updateRequestButton(currentUser.type_user);
                }
            } catch (error) {
                console.error('Error updating request:', error);
                alert('حدث خطأ أثناء تحديث الحالة');
            }
        }

        // دالة تحديث مظهر الزر
        function updateRequestButton(status) {
            const button = document.getElementById('requestButton');
            if (status) {
                button.classList.add('active');
                button.querySelector('span:first-child').textContent = 'الغاء الطلب';
            } else {
                button.classList.remove('active');
                button.querySelector('span:first-child').textContent = 'لا يوجد طلب';
            }
        }

        // ... بقية الدوال كما كانت ...
    </script>

</body>
</html>
