<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary-color: #2A9D8F;
    --secondary-color: #264653;
    --accent-color: #E9C46A;
    --text-color: #ffffff;
}

body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
    color: var(--text-color);
    min-height: 100vh;
    padding: 20px 0;
    margin: 0;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.user-info {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
}

.user-info i {
    font-size: 40px;
    color: var(--accent-color);
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    transition: transform 0.3s ease;
}

.user-info:hover i {
    transform: rotate(360deg);
}

.user-info h2 {
    margin: 0 0 8px 0;
    font-size: 1.6rem;
}

.user-info p {
    margin: 0;
    opacity: 0.9;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

#userEmail::before {
    content: "email";
    font-family: 'Material Icons Round';
    font-size: 18px;
    margin-left: 8px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-box {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.stat-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.stat-box i {
    font-size: 32px;
    color: var(--accent-color);
    margin-bottom: 15px;
    display: block;
}

.stat-value {
    display: block;
    font-size: 1.8rem;
    font-weight: 700;
    margin-top: 10px;
    color: var(--accent-color);
}

.products {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 25px;
    margin-top: 20px;
}

.products h3 {
    margin: 0 0 25px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
}

.products h3 i {
    font-size: 28px;
    color: var(--accent-color);
}

.product-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
    position: relative;
}

.product-item:hover {
    transform: translateX(10px);
}

.product-item p {
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
}

.product-item strong {
    color: var(--accent-color);
    min-width: 80px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.product-item strong::before {
    content: "";
    font-family: 'Material Icons Round';
    font-size: 16px;
    margin-left: 5px;
}

.product-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: flex-start;
}

.edit-btn, .delete-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
}

.edit-btn {
    background-color: var(--accent-color);
    color: var(--secondary-color);
}

.delete-btn {
    background-color: #e76f51;
    color: white;
}

.edit-btn:hover {
    background-color: #f4a261;
}

.delete-btn:hover {
    background-color: #d94830;
}

.toggle-request {
    background: var(--accent-color);
    padding: 15px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    border: none;
    color: var(--secondary-color);
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    font-weight: 600;
}

.toggle-request:hover {
    background: #f4a261;
    transform: scale(1.02);
}

hr {
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    margin: 15px 0;
}
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    try {
        const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`);
        if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');

        const user = await response.json();
        updateUI(user);
    } catch (error) {
        console.error("حدث خطأ أثناء جلب البيانات:", error);
    }

    function updateUI(user) {
        elements.userName.textContent = user.user || "مستخدم غير معروف";
        elements.userBalance.textContent = user.balance || "0";
        elements.userEmail.textContent = user.id || "بريد غير متوفر";
        elements.totalOrders.textContent = user.totalOrders || 0;
        elements.successfulOrders.textContent = user.successfulOrders || 0;
        elements.pendingOrders.textContent = user.pendingOrders || 0;
        elements.canceledOrders.textContent = user.rejectedOrders || 0;

        elements.productList.innerHTML = (user.products && Array.isArray(user.products))
            ? user.products.map(product => `
                <div class="product-item" data-product-id="${product.id}">
                    <p><strong>الاسم:</strong> ${product.name}</p>
                    <p><strong>المعرف:</strong> ${product.id}</p>
                    <p><strong>السعر:</strong> ${product.price}$</p>
                    <p><strong>الولاية:</strong> ${product.state}</p>
                    <p><strong>المدينة:</strong> ${product.city}</p>
                    <p><strong>المنطقة:</strong> ${product.region}</p>
                    <p><strong>الحالة:</strong> ${product.status}</p>
                    <p><strong>النوع:</strong> ${product.type}</p>
                    <div class="product-actions">
                        <button class="edit-btn">تعديل</button>
                        <button class="delete-btn">حذف</button>
                    </div>
                </div>
                <hr>
            `).join("")
            : `<div class="product-item">لا توجد منتجات</div>`;

        // إضافة مستمعي الأحداث للأزرار الجديدة
        document.querySelectorAll('.delete-btn').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.closest('.product-item').dataset.productId;
                handleDeleteProduct(productId);
            });
        });

        document.querySelectorAll('.edit-btn').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.closest('.product-item').dataset.productId;
                handleEditProduct(productId);
            });
        });
    }

    async function handleDeleteProduct(productId) {
        if (confirm('هل أنت متأكد من رغبتك في حذف هذا المنتج؟')) {
            try {
                const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Products/${productId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('فشل حذف المنتج');

                alert('تم حذف المنتج بنجاح');
                location.reload();
            } catch (error) {
                console.error('خطأ أثناء حذف المنتج:', error);
                alert('حدث خطأ أثناء الحذف');
            }
        }
    }

    function handleEditProduct(productId) {
        window.location.href = `edit_product.html?productId=${productId}`;
    }

    elements.requestButton.addEventListener("click", () => {
        window.location.href = "your_other_page.html";
    });
});
</script>
</body>
</html>
