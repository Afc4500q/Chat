<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .stat-card {
            border-left: 4px solid var(--secondary-color);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .product-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>

        <!-- معلومات المستخدم -->
        <div class="row mb-4" id="user-info"></div>

        <!-- الإحصائيات -->
        <div class="row row-cols-2 mb-4" id="stats"></div>

        <!-- المنتجات -->
        <div class="row" id="products-list"></div>
    </div>

    <!-- نموذج التعديل -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المنتج</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label>اسم المنتج</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>السعر</label>
                            <input type="number" id="editPrice" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>المنطقة</label>
                            <input type="text" id="editRegion" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>المدينة</label>
                            <input type="text" id="editCity" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الولاية</label>
                            <input type="text" id="editState" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الهاتف</label>
                            <input type="tel" id="editPhone" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // التحقق من الجلسة
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = 'login.html';

        let userProducts = [];

        async function loadDashboard() {
            try {
                const response = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                userProducts = response.data.products || [];
                updateUI(response.data);
            } catch (error) {
                handleError(error, 'تحميل البيانات');
            }
        }

        function updateUI(data) {
            // معلومات المستخدم
            document.getElementById('user-info').innerHTML = `
                <!-- ... (نفس الكود السابق) ... -->
            `;

            // الإحصائيات
            document.getElementById('stats').innerHTML = `
                <!-- ... (نفس الكود السابق) ... -->
            `;

            // المنتجات
            const productsHTML = userProducts.map(product => `
                <div class="col-md-4 mb-3">
                    <div class="card product-card h-100">
                        <div class="card-body">
                            <h5><i class="fas fa-cube"></i> ${product.name}</h5>
                            <div class="row">
                                <!-- ... (تفاصيل المنتج) ... -->
                                <div class="d-flex gap-2 mt-3">
                                    <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">
                                        <i class="fas fa-trash"></i> حذف
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="openEditModal('${product.id}')">
                                        <i class="fas fa-edit"></i> تعديل
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('products-list').innerHTML = productsHTML;
        }

        async function deleteProduct(productId) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            
            try {
                // الطريقة المثلى: حذف مباشر
                await axios.delete(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}/products/${productId}`);
                
                // طريقة بديلة: تحديث المصفوفة
                // userProducts = userProducts.filter(p => p.id !== productId);
                // await axios.put(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {products: userProducts});

                await loadDashboard();
                showAlert('تم الحذف بنجاح!', 'success');
            } catch (error) {
                handleError(error, 'حذف المنتج');
            }
        }

        function openEditModal(productId) {
            const product = userProducts.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('editProductId').value = productId;
            document.getElementById('editName').value = product.name;
            document.getElementById('editPrice').value = product.price;
            document.getElementById('editRegion').value = product.region || '';
            document.getElementById('editCity').value = product.city || '';
            document.getElementById('editState').value = product.state || '';
            document.getElementById('editPhone').value = product.phone || '';
            
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveChanges() {
            const productId = document.getElementById('editProductId').value;
            try {
                const updatedData = {
                    name: document.getElementById('editName').value,
                    price: parseFloat(document.getElementById('editPrice').value),
                    region: document.getElementById('editRegion').value,
                    city: document.getElementById('editCity').value,
                    state: document.getElementById('editState').value,
                    phone: document.getElementById('editPhone').value
                };

                // الطريقة المثلى: تحديث مباشر
                await axios.put(
                    `https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}/products/${productId}`,
                    updatedData
                );

                // طريقة بديلة: تحديث المصفوفة
                // const index = userProducts.findIndex(p => p.id === productId);
                // userProducts[index] = {...userProducts[index], ...updatedData};
                // await axios.put(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {products: userProducts});

                await loadDashboard();
                new bootstrap.Modal(document.getElementById('editModal')).hide();
                showAlert('تم التحديث بنجاح!', 'success');
            } catch (error) {
                handleError(error, 'تحديث المنتج');
            }
        }

        function handleError(error, operation) {
            console.error(`خطأ في ${operation}:`, error);
            showAlert(`فشل في ${operation}: ${error.message}`, 'danger');
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} position-fixed top-0 end-0 m-3`;
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        // بدء التحميل
        loadDashboard();
    </script>
</body>
</html>
