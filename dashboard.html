<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary-color: #2A9D8F;
    --secondary-color: #264653;
    --accent-color: #E9C46A;
    --text-color: #ffffff;
}

body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
    color: var(--text-color);
    min-height: 100vh;
    padding: 20px 0;
    margin: 0;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.user-info {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
}

.user-info i {
    font-size: 40px;
    color: var(--accent-color);
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    transition: transform 0.3s ease;
}

.user-info:hover i {
    transform: rotate(360deg);
}

.user-info h2 {
    margin: 0 0 8px 0;
    font-size: 1.6rem;
}

.user-info p {
    margin: 0;
    opacity: 0.9;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

#userEmail::before {
    content: "email";
    font-family: 'Material Icons Round';
    font-size: 18px;
    margin-left: 8px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-box {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.stat-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.stat-box i {
    font-size: 32px;
    color: var(--accent-color);
    margin-bottom: 15px;
    display: block;
}

.stat-value {
    display: block;
    font-size: 1.8rem;
    font-weight: 700;
    margin-top: 10px;
    color: var(--accent-color);
}

.products {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 25px;
    margin-top: 20px;
}

.products h3 {
    margin: 0 0 25px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
}

.products h3 i {
    font-size: 28px;
    color: var(--accent-color);
}

.product-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
    position: relative;
}

.product-item:hover {
    transform: translateX(10px);
}

.product-item p {
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
}

.product-item strong {
    color: var(--accent-color);
    min-width: 80px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.product-item strong::before {
    content: "";
    font-family: 'Material Icons Round';
    font-size: 16px;
    margin-left: 5px;
}

.product-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: flex-start;
}

.edit-btn, .delete-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
}

.edit-btn {
    background-color: var(--accent-color);
    color: var(--secondary-color);
}

.delete-btn {
    background-color: #e76f51;
    color: white;
}

.edit-btn:hover {
    background-color: #f4a261;
}

.delete-btn:hover {
    background-color: #d94830;
}

.toggle-request {
    background: var(--accent-color);
    padding: 15px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    border: none;
    color: var(--secondary-color);
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    font-weight: 600;
}

.toggle-request:hover {
    background: #f4a261;
    transform: scale(1.02);
}

hr {
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    margin: 15px 0;
}

.product-item.editing {
    border: 2px solid var(--accent-color);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(233, 196, 106, 0.3); }
    70% { box-shadow: 0 0 0 10px rgba(233, 196, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(233, 196, 106, 0); }
}

input:invalid {
    border-color: #e76f51 !important;
    animation: shake 0.5s;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    const API_URL = `https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`;
    let userData = null;

    async function loadUserData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            userData = await response.json();
            userData.products = userData.products || [];
            updateUI();
        } catch (error) {
            console.error("حدث خطأ أثناء جلب البيانات:", error);
        }
    }

    function updateUI() {
        elements.userName.textContent = userData.user || "مستخدم غير معروف";
        elements.userBalance.textContent = `رصيد: ${userData.balance || 0} $`;
        elements.userEmail.innerHTML = `<span class="material-icons-round">email</span> ${userData.email || "بريد غير متوفر"}`;
        elements.totalOrders.textContent = userData.totalOrders || 0;
        elements.successfulOrders.textContent = userData.successfulOrders || 0;
        elements.pendingOrders.textContent = userData.pendingOrders || 0;
        elements.canceledOrders.textContent = userData.rejectedOrders || 0;

        renderProducts();
        setupEventListeners();
        updateRequestButton(userData.type_user);
    }

    function renderProducts() {
        elements.productList.innerHTML = userData.products.length > 0 
            ? userData.products.map((product, index) => `
                <div class="product-item" data-index="${index}">
                    ${generateProductHTML(product, index)}
                    <div class="product-actions">
                        <button class="edit-btn">${product.isEditing ? 'حفظ' : 'تعديل'}</button>
                        <button class="delete-btn">حذف</button>
                    </div>
                </div>
                <hr>
            `).join("")
            : `<div class="product-item">لا توجد منتجات</div>`;
    }

    function generateProductHTML(product, index) {
        return `
            <div class="product-info">
                <p><strong>ID المنتج:</strong> ${product.id}</p>
                <p><strong>الحالة:</strong> ${product.status}</p>
                ${product.isEditing ? getEditableFields(product, index) : getStaticFields(product)}
            </div>
        `;
    }

    function getStaticFields(product) {
        return `
            <p><strong>الاسم:</strong> ${product.name}</p>
            <p><strong>السعر:</strong> ${product.price}$</p>
            <p><strong>الولاية:</strong> ${product.state}</p>
            <p><strong>المدينة:</strong> ${product.city}</p>
            <p><strong>المنطقة:</strong> ${product.area}</p>
            <p><strong>النوع:</strong> ${product.type}</p>
        `;
    }

    function getEditableFields(product, index) {
        return `
            <p><strong>الاسم:</strong> 
                <input type="text" value="${product.name}" id="name-${index}">
            </p>
            <p><strong>السعر:</strong> 
                <input type="number" value="${product.price}" id="price-${index}">
            </p>
            <p><strong>الولاية:</strong> 
                <input type="text" value="${product.state}" id="state-${index}">
            </p>
            <p><strong>المدينة:</strong> 
                <input type="text" value="${product.city}" id="city-${index}">
            </p>
            <p><strong>المنطقة:</strong> 
                <input type="text" value="${product.area}" id="area-${index}">
            </p>
            <p><strong>النوع:</strong> 
                <input type="text" value="${product.type}" id="type-${index}">
            </p>
        `;
    }

    function setupEventListeners() {
        document.querySelectorAll('.product-item').forEach(item => {
            const index = item.dataset.index;
            
            // حدث التعديل/الحفظ
            item.querySelector('.edit-btn').addEventListener('click', async () => {
                if (!userData.products[index].isEditing) {
                    userData.products[index].isEditing = true;
                } else {
                    await saveProduct(index);
                }
                renderProducts();
            });

            // حدث الحذف
            item.querySelector('.delete-btn').addEventListener('click', () => {
                deleteProduct(index);
            });
        });
    }

    async function saveProduct(index) {
        const product = userData.products[index];
        
        const updatedProduct = {
            ...product,
            name: document.getElementById(`name-${index}`).value,
            price: parseFloat(document.getElementById(`price-${index}`).value),
            state: document.getElementById(`state-${index}`).value,
            city: document.getElementById(`city-${index}`).value,
            area: document.getElementById(`area-${index}`).value,
            type: document.getElementById(`type-${index}`).value,
            isEditing: false
        };

        userData.products[index] = updatedProduct;

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحفظ');
            alert('تم التحديث بنجاح');
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء الحفظ');
        }
    }

    async function deleteProduct(index) {
        if (!confirm('هل أنت متأكد من الحذف؟')) return;

        userData.products.splice(index, 1);

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحذف');
            loadUserData();
            alert('تم الحذف بنجاح');
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء الحذف');
        }
    }

    // التهيئة الأولية
    await loadUserData();
    elements.requestButton.addEventListener("click", () => {
        window.location.href = "new-request.html";
    });

    function updateRequestButton(userType) {
        if (userType === 'admin') {
            elements.requestButton.style.display = 'none';
        }
    }
});
    </script>  
</body>
</html>
