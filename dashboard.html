<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
            --accent-color: #FF6B6B;
            --background-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
        }

        .dashboard-header {
            background: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .product-card {
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: none;
        }

        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .badge-custom {
            background: var(--secondary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .action-btns .btn {
            min-width: 100px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .modal-header {
            background: var(--primary-color);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        @media (max-width: 768px) {
            .stat-card {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-primary m-0">
                    <i class="fas fa-tachometer-alt"></i> 
                    لوحة التحكم
                </h1>
                <div class="action-btns d-flex gap-2">
                    <button class="btn btn-success" onclick="goToRequestPage()">
                        <i class="fa-solid fa-plus"></i> طلب جديد
                    </button>
                    <button class="btn btn-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-4">
        <!-- معلومات المستخدم -->
        <div class="row g-4 mb-4" id="user-info"></div>

        <!-- الإحصائيات -->
        <div class="row g-4 mb-4" id="stats"></div>

        <!-- المنتجات -->
        <div class="row g-4" id="products-list">
            <div class="col-12">
                <h4 class="mb-3 text-primary">
                    <i class="fas fa-cubes"></i> المنتجات
                </h4>
            </div>
        </div>
    </div>

    <!-- نموذج التعديل -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المنتج</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm" class="row g-3">
                        <input type="hidden" id="editProductId">
                        <div class="col-md-6">
                            <label class="form-label">اسم المنتج</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">السعر</label>
                            <input type="number" id="editPrice" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">المنطقة</label>
                            <input type="text" id="editRegion" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">المدينة</label>
                            <input type="text" id="editCity" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">الولاية</label>
                            <input type="text" id="editState" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">الهاتف</label>
                            <input type="tel" id="editPhone" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // التحقق من الجلسة
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) window.location.href = "login.html";

        let refreshInterval;
        let productsData = [];

        // تحميل البيانات عند بدء التشغيل
        document.addEventListener("DOMContentLoaded", () => {
            loadDashboard();
            // تحديث تلقائي كل 30 ثانية
            refreshInterval = setInterval(loadDashboard, 30000);
        });

        async function loadDashboard() {
            try {
                const response = await fetch(
                    `https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`
                );
                const data = await response.json();

                productsData = data.products || [];
                updateUserInfo(data);
                updateStats(data);
                renderProducts(productsData);
            } catch (error) {
                handleError("حدث خطأ أثناء تحميل البيانات:", error);
            }
        }

        function goToRequestPage() {
            window.location.href = `reaspet.html?userId=${currentUser.id}`;
        }

        function updateUserInfo(data) {
            document.getElementById("user-info").innerHTML = `
                <div class="col-md-4">
                    <div class="card stat-card border-start border-primary border-4 h-100">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">
                                <i class="fas fa-user text-primary"></i> 
                                الاسم
                            </h5>
                            <h2 class="card-title text-primary">${data.name}</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card border-start border-success border-4 h-100">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">
                                <i class="fas fa-at text-success"></i> 
                                اسم المستخدم
                            </h5>
                            <h2 class="card-title text-success">${data.user}</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card border-start border-danger border-4 h-100">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">
                                <i class="fas fa-wallet text-danger"></i> 
                                الرصيد
                            </h5>
                            <h2 class="card-title text-danger">${data.total} IQD</h2>
                        </div>
                    </div>
                </div>`;
        }

        function updateStats(data) {
            document.getElementById("stats").innerHTML = `
                <div class="col-lg-3 col-md-6">
                    <div class="card stat-card border-start border-primary border-4">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">الطلبات الكلية</h5>
                            <h2 class="card-title text-primary">${data.total}</h2>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card stat-card border-start border-success border-4">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">الطلبات الناجحة</h5>
                            <h2 class="card-title text-success">${data.successful}</h2>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card stat-card border-start border-warning border-4">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">الطلبات المعلقة</h5>
                            <h2 class="card-title text-warning">${data.pending}</h2>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="card stat-card border-start border-danger border-4">
                        <div class="card-body">
                            <h5 class="card-subtitle mb-2">الطلبات المرفوضة</h5>
                            <h2 class="card-title text-danger">${data.rejected}</h2>
                        </div>
                    </div>
                </div>`;
        }

        function renderProducts(products) {
            const productsList = document.getElementById("products-list");
            productsList.innerHTML = products.map(product => `
                <div class="col-md-4">
                    <div class="card product-card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-cube text-primary"></i> 
                                    ${product.name}
                                </h5>
                                <span class="badge-custom">${product.price} IQD</span>
                            </div>
                            <div class="product-details">
                                <p class="text-muted mb-1">
                                    <i class="fas fa-map-marker-alt"></i> 
                                    ${product.region || "غير محدد"}
                                </p>
                                <p class="text-muted mb-1">
                                    <i class="fas fa-city"></i> 
                                    ${product.city || "غير محدد"}
                                </p>
                                <p class="text-muted">
                                    <i class="fas fa-phone"></i> 
                                    ${product.phone || "غير متوفر"}
                                </p>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteProduct('${product.id}')">
                                    <i class="fas fa-trash"></i> حذف
                                </button>
                                <button class="btn btn-primary btn-sm" onclick="openEditModal('${product.id}')">
                                    <i class="fas fa-edit"></i> تعديل
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`
            ).join("");
        }

        async function deleteProduct(productId) {
            if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;

            try {
                const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const userData = await userRes.json();
                
                const updatedProducts = userData.products.filter(p => p.id !== productId);
                
                await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ products: updatedProducts })
                });

                showSuccess("تم الحذف بنجاح!");
                await loadDashboard();
            } catch (error) {
                handleError("حدث خطأ أثناء الحذف:", error);
            }
        }

        function openEditModal(productId) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return alert('المنتج غير موجود');

            document.getElementById("editProductId").value = product.id;
            document.getElementById("editName").value = product.name;
            document.getElementById("editPrice").value = product.price;
            document.getElementById("editRegion").value = product.region || "";
            document.getElementById("editCity").value = product.city || "";
            document.getElementById("editState").value = product.state || "";
            document.getElementById("editPhone").value = product.phone || "";

            new bootstrap.Modal(document.getElementById("editModal")).show();
        }

        async function saveChanges() {
            const productId = document.getElementById("editProductId").value;
            const updatedData = {
                name: document.getElementById("editName").value,
                price: Number(document.getElementById("editPrice").value),
                region: document.getElementById("editRegion").value,
                city: document.getElementById("editCity").value,
                state: document.getElementById("editState").value,
                phone: document.getElementById("editPhone").value,
            };

            try {
                const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const userData = await userRes.json();
                
                const updatedProducts = userData.products.map(p => 
                    p.id === productId ? { ...p, ...updatedData } : p
                );
                
                await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ products: updatedProducts })
                });

                showSuccess("تم التحديث بنجاح!");
                const modalElement = document.getElementById("editModal");
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                if (modalInstance) modalInstance.hide();
                await loadDashboard();
            } catch (error) {
                handleError("حدث خطأ أثناء التحديث:", error);
            }
        }

        function showSuccess(message) {
            alert(message);
        }

        function handleError(logMessage, error) {
            console.error(logMessage, error);
            alert("فشل في العملية! الرجاء المحاولة لاحقًا");
        }

        function logout() {
            clearInterval(refreshInterval);
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
