<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1A237E;
            --secondary-color: #64B5F6;
            --light-bg: #F4F6F9;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--light-bg);
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: var(--primary-color);
            color: #fff;
            padding: 20px;
        }
        .sidebar a {
            display: block;
            padding: 10px;
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background: var(--secondary-color);
            border-radius: 5px;
        }
        .main-content {
            margin-right: 260px;
            padding: 20px;
        }
        .stat-card {
            border-radius: 10px;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        .bg-success { background: #43A047; }
        .bg-warning { background: #FB8C00; }
        .bg-danger { background: #E53935; }
        .product-card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            background: var(--secondary-color);
            color: #fff;
        }
        .btn-custom:hover {
            background: #42A5F5;
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي -->
    <div class="sidebar">
        <h3 class="text-center">لوحة التحكم</h3>
        <a href="#"><i class="fas fa-home"></i> الصفحة الرئيسية</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        <a href="#" onclick="goToRequestPage()"><i class="fa-solid fa-bell"></i> إجراء طلب</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2 class="text-primary"><i class="fas fa-chart-line"></i> الإحصائيات</h2>
        <div class="row mb-4" id="stats"></div>

        <h2 class="text-primary"><i class="fas fa-box"></i> المنتجات</h2>
        <div class="row" id="products-list"></div>
    </div>

    <!-- نموذج تعديل المنتج -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المنتج</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label>اسم المنتج</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>السعر</label>
                            <input type="number" id="editPrice" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>الهاتف</label>
                            <input type="tel" id="editPhone" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) window.location.href = "login.html";

        document.addEventListener("DOMContentLoaded", loadDashboard);

        async function loadDashboard() {
            try {
                const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const data = await response.json();
                updateStats(data);
                renderProducts(data.products || []);
            } catch (error) {
                alert("حدث خطأ أثناء تحميل البيانات!");
            }
        }

        function updateStats(data) {
            document.getElementById("stats").innerHTML = `
                <div class="col-md-3">
                    <div class="stat-card bg-success">
                        <h5>الطلبات الكلية</h5>
                        <h1>${data.total}</h1>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card bg-warning">
                        <h5>المعلقة</h5>
                        <h1>${data.pending}</h1>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card bg-danger">
                        <h5>المرفوضة</h5>
                        <h1>${data.rejected}</h1>
                    </div>
                </div>
            `;
        }

        function renderProducts(products) {
            const productsList = document.getElementById("products-list");
            productsList.innerHTML = products.map(product => `
                <div class="col-md-4 mb-3">
                    <div class="card product-card p-3">
                        <h5>${product.name}</h5>
                        <p>السعر: ${product.price} IQD</p>
                        <p>الهاتف: ${product.phone || "غير متوفر"}</p>
                        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">حذف</button>
                        <button class="btn btn-custom btn-sm" onclick="openEditModal('${product.id}')">تعديل</button>
                    </div>
                </div>
            `).join("");
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function goToRequestPage() {
            window.location.href = `reaspet.html?userId=${currentUser.id}`;
        }
    </script>
</body>
</html>
