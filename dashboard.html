<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الموقع</title>
    <!-- رابط أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .user-box {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .user-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .user-icon {
            font-size: 24px;
            color: #666;
            margin-left: 15px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .detail-icon {
            font-size: 20px;
            color: #4CAF50;
            width: 30px;
            margin-left: 10px;
        }

        .user-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-left: 15px;
            border: 2px solid #4CAF50;
        }

        .edit-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-btn i {
            font-size: 14px;
        }

        h2 {
            color: #333;
            margin: 0;
        }

        p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="user-box">
        <div class="user-header">
            <i class="fas fa-user-circle user-icon"></i>
            <h2>الملف الشخصي</h2>
        </div>

        <div class="user-details">
            <div class="detail-item">
                <i class="fas fa-user detail-icon"></i>
                <div>
                    <h2>محمد أحمد</h2>
                    <p>اسم المستخدم</p>
                </div>
                <img src="user-image.jpg" alt="صورة المستخدم" class="user-image">
            </div>

            <div class="detail-item">
                <i class="fas fa-envelope detail-icon"></i>
                <div>
                    <h2>mohamed@example.com</h2>
                    <p>البريد الإلكتروني</p>
                </div>
            </div>

            <button class="edit-btn">
                <i class="fas fa-edit"></i>
                تعديل المعلومات
            </button>
        </div>
    </div>
</body>
</html>
