<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .stat-card {
            border-left: 4px solid var(--secondary-color);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .product-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>

        <!-- معلومات المستخدم -->
        <div class="row mb-4" id="user-info"></div>

        <!-- الإحصائيات -->
        <div class="row row-cols-2 mb-4" id="stats"></div>

        <!-- المنتجات -->
        <div class="row" id="products-list"></div>
    </div>

    <!-- نموذج التعديل -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تعديل المنتج</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label>اسم المنتج</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>السعر</label>
                            <input type="number" id="editPrice" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>المنطقة</label>
                            <input type="text" id="editRegion" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>المدينة</label>
                            <input type="text" id="editCity" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الولاية</label>
                            <input type="text" id="editState" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>الهاتف</label>
                            <input type="tel" id="editPhone" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveChanges()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// التحقق من الجلسة
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) window.location.href = "login.html";

// متغيرات التطبيق
let productsData = [];

// تحميل البيانات الأولية
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const [userResponse, productsResponse] = await Promise.all([
            fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`),
            fetch(`https://673a394a339a4ce445179ae7.mockapi.io/products?userId=${currentUser.id}`)
        ]);
        
        if (!userResponse.ok || !productsResponse.ok) throw new Error('فشل في جلب البيانات');
        
        const userData = await userResponse.json();
        productsData = await productsResponse.json();

        // تحديث الواجهة
        updateUserInfo(userData);
        updateStats(userData);
        renderProducts(productsData);
    } catch (error) {
        handleError('حدث خطأ في التحميل:', error);
    }
});

// تحديث معلومات المستخدم
function updateUserInfo(data) {
    document.getElementById("user-info").innerHTML = `
    <div class="col-md-4 mb-3">
        <div class="card stat-card h-100">
            <div class="card-body">
                <h5><i class="fas fa-user text-primary"></i> الاسم</h5>
                <h2>${data.name}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card stat-card h-100">
            <div class="card-body">
                <h5><i class="fas fa-at text-success"></i> اسم المستخدم</h5>
                <h2>${data.username}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card stat-card h-100">
            <div class="card-body">
                <h5><i class="fas fa-wallet text-danger"></i> الرصيد</h5>
                <h2>${data.balance} IQD</h2>
            </div>
        </div>
    </div>`;
}

// تحديث الإحصائيات
function updateStats(data) {
    document.getElementById("stats").innerHTML = `
    <div class="col mb-3">
        <div class="card bg-primary text-white h-100">
            <div class="card-body">
                <h5>الطلبات الكلية</h5>
                <h1>${data.totalOrders || 0}</h1>
            </div>
        </div>
    </div>
    <div class="col mb-3">
        <div class="card bg-success text-white h-100">
            <div class="card-body">
                <h5>الطلبات الناجحة</h5>
                <h1>${data.completedOrders || 0}</h1>
            </div>
        </div>
    </div>
    <div class="col mb-3">
        <div class="card bg-warning text-white h-100">
            <div class="card-body">
                <h5>الطلبات المعلقة</h5>
                <h1>${data.pendingOrders || 0}</h1>
            </div>
        </div>
    </div>
    <div class="col mb-3">
        <div class="card bg-danger text-white h-100">
            <div class="card-body">
                <h5>الطلبات الملغاة</h5>
                <h1>${data.canceledOrders || 0}</h1>
            </div>
        </div>
    </div>`;
}

// عرض المنتجات
function renderProducts(products) {
    document.getElementById("products-list").innerHTML = products.map(product => `
    <div class="col-md-4 mb-3">
        <div class="card product-card h-100">
            <div class="card-body">
                <h5><i class="fas fa-cube"></i> ${product.name}</h5>
                <p class="text-muted">${product.description || ''}</p>
                <div class="product-details">
                    <p><i class="fas fa-tag"></i> السعر: ${product.price} IQD</p>
                    <p><i class="fas fa-map-marker-alt"></i> الموقع: ${product.city}, ${product.region}</p>
                    <p><i class="fas fa-phone"></i> ${product.phone || 'لا يوجد رقم'} </p>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="openEditModal('${product.id}')">
                        <i class="fas fa-edit"></i> تعديل
                    </button>
                </div>
            </div>
        </div>
    </div>`).join('');
}

// حذف المنتج
async function deleteProduct(productId) {
    if (!confirm('هل تريد الحذف بشكل نهائي؟')) return;
    
    try {
        const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/products/${productId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) throw new Error('فشل الحذف');
        
        productsData = productsData.filter(p => p.id !== productId);
        renderProducts(productsData);
        showSuccess('تم الحذف بنجاح!');
    } catch (error) {
        handleError('حدث خطأ أثناء الحذف:', error);
    }
}

// فتح نموذج التعديل
function openEditModal(productId) {
    const product = productsData.find(p => p.id === productId);
    if (!product) return;
    
    document.getElementById('editProductId').value = product.id;
    document.getElementById('editName').value = product.name;
    document.getElementById('editPrice').value = product.price;
    document.getElementById('editRegion').value = product.region;
    document.getElementById('editCity').value = product.city;
    document.getElementById('editState').value = product.state;
    document.getElementById('editPhone').value = product.phone;
    
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

// حفظ التعديلات
async function saveChanges() {
    const productId = document.getElementById('editProductId').value;
    const updatedData = {
        name: document.getElementById('editName').value,
        price: document.getElementById('editPrice').value,
        region: document.getElementById('editRegion').value,
        city: document.getElementById('editCity').value,
        state: document.getElementById('editState').value,
        phone: document.getElementById('editPhone').value,
        userId: currentUser.id
    };
    
    try {
        const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/products/${productId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(updatedData)
        });
        
        if (!response.ok) throw new Error('فشل التحديث');
        
        const updatedProduct = await response.json();
        const index = productsData.findIndex(p => p.id === productId);
        productsData[index] = updatedProduct;
        
        renderProducts(productsData);
        showSuccess('تم التحديث بنجاح!');
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    } catch (error) {
        handleError('حدث خطأ أثناء التحديث:', error);
    }
}

// وظائف مساعدة
function showSuccess(message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-success alert-dismissible fade show fixed-top m-3';
    alertDiv.role = 'alert';
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.body.appendChild(alertDiv);
    setTimeout(() => alertDiv.remove(), 3000);
}

function handleError(logMessage, error) {
    console.error(logMessage, error);
    alert(`حدث خطأ: ${error.message}`);
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}
</script>
</body>
</html>
