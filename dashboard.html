<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: white;
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .products {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .logout-btn {
            background: red;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <h2 id="userName">اسم المستخدم</h2>
            <p id="userEmail">البريد الإلكتروني</p>
            <button id="requestButton" class="toggle-request" style="color: white; margin-top: 20px;">
    لا يوجد طلب
</button>
        </div>

        <div class="stats">
            <div class="stat-box">الطلبات: <span id="totalOrders">0</span></div>
            <div class="stat-box">الناجحة: <span id="successfulOrders">0</span></div>
            <div class="stat-box">المعلقة: <span id="pendingOrders">0</span></div>
            <div class="stat-box">الملغاة: <span id="canceledOrders">0</span></div>
        </div>

        <div class="products">
            <h3>المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const elements = {
            userName: document.getElementById("userName"),
            userEmail: document.getElementById("userEmail"),
            totalOrders: document.getElementById("totalOrders"),
            successfulOrders: document.getElementById("successfulOrders"),
            pendingOrders: document.getElementById("pendingOrders"),
            canceledOrders: document.getElementById("canceledOrders"),
            productList: document.getElementById("productList"),
            requestButton: document.getElementById("requestButton")
        };

        const userId = localStorage.getItem("loggedInUserId");
        if (!userId) {
            alert("يرجى تسجيل الدخول");
            window.location.href = "login.html";
            return;
        }

        try {
            const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');

            const user = await response.json();
            updateUI(user);
        } catch (error) {
            console.error("حدث خطأ أثناء جلب البيانات:", error);
        }

        function updateUI(user) {
            elements.userName.textContent = user.user || "مستخدم غير معروف";
            elements.userEmail.textContent = user.email || "بريد غير متوفر";
            elements.totalOrders.textContent = user.totalOrders || 0;
            elements.successfulOrders.textContent = user.successfulOrders || 0;
            elements.pendingOrders.textContent = user.pendingOrders || 0;
            elements.canceledOrders.textContent = user.rejectedOrders || 0;

            // تحديث المنتجات
            elements.productList.innerHTML = (user.products && Array.isArray(user.products)) 
                ? user.products.map(product => `
                    <div class="product-item">
                        <p><strong>الاسم:</strong> ${product.name || "غير متوفر"}</p>
                        <p><strong>المعرف:</strong> ${product.id || "غير متوفر"}</p>
                        <p><strong>السعر:</strong> ${product.price ? `${product.price}$` : "غير متوفر"}</p>
                        <p><strong>الولاية:</strong> ${product.state || "غير متوفر"}</p>
                        <p><strong>المدينة:</strong> ${product.city || "غير متوفر"}</p>
                        <p><strong>المنطقة:</strong> ${product.region || "غير متوفر"}</p>
                        <p><strong>الحالة:</strong> ${product.status || "غير متوفر"}</p>
                        <p><strong>النوع:</strong> ${product.type || "غير متوفر"}</p>
                    </div>
                `).join("<hr style='border: 1px solid rgba(255,255,255,0.3); margin: 10px 0;'>")
                : `<div class="product-item">لا توجد منتجات</div>`;

            // تحديث زر الطلب حسب قيمة type_user
            updateRequestButton(user.type_user);
        }

        function updateRequestButton(typeUser) {
            if (typeUser == 1) {
                elements.requestButton.textContent = "إلغاء الطلب";
                elements.requestButton.style.background = "red";
            } else {
                elements.requestButton.textContent = "لا يوجد طلب";
                elements.requestButton.style.background = "green";
            }
        }

        elements.requestButton.addEventListener("click", async () => {
            try {
                const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`);
                if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');

                const user = await response.json();
                const newTypeUser = user.type_user === 1 ? 0 : 1;

                const updateResponse = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type_user: newTypeUser })
                });

                if (!updateResponse.ok) throw new Error('فشل تحديث الطلب');

                updateRequestButton(newTypeUser);
            } catch (error) {
                console.error("حدث خطأ أثناء تحديث الطلب:", error);
            }
        });
    });
</script>

</body>
</html>
