<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الحديثة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2196F3;
            --secondary-color: #FF4081;
            --background: #F5F5F5;
            --surface: #FFFFFF;
            --text-primary: #212121;
            --success: #4CAF50;
            --warning: #FFC107;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px rgba(33, 150, 243, 0.2);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .neumorphic-btn {
            border: none;
            border-radius: 12px;
            background: var(--surface);
            box-shadow: 5px 5px 10px #d9d9d9,
                       -5px -5px 10px #ffffff;
            transition: all 0.3s ease;
        }

        .neumorphic-btn:hover {
            box-shadow: inset 5px 5px 10px #d9d9d9,
                       inset -5px -5px 10px #ffffff;
        }

        .gradient-text {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-floating > .form-control {
            border-radius: 12px;
            border: 2px solid #eee;
            transition: all 0.3s ease;
        }

        .form-floating > .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .dashboard-header {
            background: var(--surface);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            padding: 1rem 2rem;
        }

        .status-قيد المراجعة { color: #9E9E9E; }
.status-قيد الشحن { color: #2196F3; }
.status-تم التسليم { color: #4CAF50; }
.status-تم الرفض { color: #F44336; }

.fa-circle {
    font-size: 0.6rem;
    vertical-align: middle;
}
    </style>
</head>
<body class="py-4">
    <div class="container-xl">
        <!-- Header -->
        <div class="dashboard-header glass-card mb-5">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon">
                        <i class="fas fa-chart-line fa-lg"></i>
                    </div>
                    <h1 class="h3 mb-0 gradient-text">لوحة التحكم</h1>
                </div>
                <div class="d-flex gap-3">
                    <button class="btn neumorphic-btn text-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-2"></i> تسجيل الخروج
                    </button>
                    <button class="btn neumorphic-btn text-success" onclick="goToRequestPage()">
                        <i class="fas fa-plus-circle me-2"></i> طلب جديد
                    </button>
                </div>
            </div>
        </div>

        <!-- معلومات المستخدم -->
        <div class="row g-4 mb-4" id="user-info"></div>

        <!-- الإحصائيات -->
       <!-- الإحصائيات -->
<div class="row g-4 mb-4" id="stats">
    <div class="row g-4 mb-2">
        <div class="col-md-6">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #9C27B0, #E91E63)">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1">الطلبات الكلية</h6>
                        <h2 class="gradient-text mb-0">${data.total}</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #4CAF50, #8BC34A)">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1">الطلبات الناجحة</h6>
                        <h2 class="text-success mb-0">${data.successful}</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #FF9800, #FFC107)">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1">الطلبات المعلقة</h6>
                        <h2 class="text-warning mb-0">${data.pending}</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="stat-icon" style="background: linear-gradient(45deg, #F44336, #E91E63)">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1">الطلبات المرفوضة</h6>
                        <h2 class="text-danger mb-0">${data.rejected}</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

        <!-- المنتجات -->
        <div class="row g-4" id="products-list"></div>
    </div>

    <!-- نموذج التعديل -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-glass">
                <div class="modal-header border-0">
                    <h5 class="modal-title gradient-text">تعديل المنتج</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editProductId">
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="editName" required>
                            <label for="editName">اسم المنتج</label>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="number" class="form-control" id="editPrice" required>
                                    <label for="editPrice">السعر</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control" id="editPhone">
                                    <label for="editPhone">الهاتف</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="editRegion">
                                    <label for="editRegion">المنطقة</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="editCity">
                                    <label for="editCity">المدينة</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="editState">
                                    <label for="editState">الولاية</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn neumorphic-btn" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn glass-card text-white" 
                            style="background: linear-gradient(45deg, var(--primary-color), var(--secondary-color))"
                            onclick="saveChanges()">
                        حفظ التعديلات
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) window.location.href = "login.html";

        let productsData = [];

        document.addEventListener("DOMContentLoaded", loadDashboard);

        async function loadDashboard() {
            try {
                const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const data = await response.json();
                productsData = data.products || [];
                updateUserInfo(data);
                updateStats(data);
                renderProducts(productsData);
            } catch (error) {
                handleError("حدث خطأ أثناء تحميل البيانات:", error);
            }
        }

        function updateUserInfo(data) {
            document.getElementById("user-info").innerHTML = `
                <div class="col-md-4">
                    <div class="glass-card p-4 h-100">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">الاسم الكامل</h6>
                                <h4 class="mb-0">${data.name}</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-4 h-100">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background: linear-gradient(45deg, ${'var(--success)'}, #8BC34A)">
                                <i class="fas fa-at"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">اسم المستخدم</h6>
                                <h4 class="mb-0">${data.user}</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-4 h-100">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background: linear-gradient(45deg, ${'var(--warning)'}, #FF9800)">
                                <i class="fas fa-wallet"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">الرصيد</h6>
                                <h4 class="mb-0">${data.total} IQD</h4>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function updateStats(data) {
            document.getElementById("stats").innerHTML = `
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h5 class="text-muted">الطلبات الكلية</h5>
                        <h1 class="gradient-text">${data.total}</h1>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h5 class="text-muted">الطلبات الناجحة</h5>
                        <h1 class="text-success">${data.successful}</h1>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h5 class="text-muted">الطلبات المعلقة</h5>
                        <h1 class="text-warning">${data.pending}</h1>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h5 class="text-muted">الطلبات المرفوضة</h5>
                        <h1 class="text-danger">${data.rejected}</h1>
                    </div>
                </div>`;
        }

        function renderProducts(products) {
    document.getElementById("products-list").innerHTML = products.map(product => `
        <div class="col-md-4">
            <div class="glass-card p-4 h-100 position-relative">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h5 class="mb-0">${product.id}</h5>
                    <span class="badge bg-primary rounded-pill">${product.price} IQD</span>
                </div>
                <div class="text-muted small">
                    <p class="mb-1"><i class="fa-solid fa-signature"></i>${product.name || 'غير محدد'}</p>
                    <p class="mb-1"><i class="fa-solid fa-house"></i>>${product.state || 'غير محدد'}</p>
                    <p class="mb-1"><i class="fas fa-city me-2"></i>${product.city || 'غير محدد'}</p>
                    <p class="mb-1"><i class="fa-solid fa-house-user"></i></i>${product.area || 'غير محدد'}</p>
                    <p class="mb-1"><i class="fas fa-phone me-2"></i>${product.phone || 'غير محدد'}</p>
                    <p class="mb-1 status-${product.status}">
                        <i class="fas fa-circle me-2"></i>
                        ${product.status || 'غير محدد'}
                    </p>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-sm neumorphic-btn text-danger" onclick="deleteProduct('${product.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="btn btn-sm neumorphic-btn text-primary" onclick="openEditModal('${product.id}')">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            </div>
        </div>`
    ).join("");
}

        // باقي دوال الجافاسكريبت كما هي بدون تغيير
        async function deleteProduct(productId) {
            if (!confirm("هل أنت متأكد من الحذف؟")) return;
            try {
                const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const userData = await userRes.json();
                const updatedProducts = userData.products.filter(p => p.id !== productId);
                await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ products: updatedProducts })
                });
                showSuccess("تم الحذف بنجاح!");
                await loadDashboard();
            } catch (error) {
                handleError("حدث خطأ أثناء الحذف:", error);
            }
        }

        function openEditModal(productId) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return alert('المنتج غير موجود');
            document.getElementById("editProductId").value = product.id;
            document.getElementById("editName").value = product.name;
            document.getElementById("editPrice").value = product.price;
            document.getElementById("editRegion").value = product.region || "";
            document.getElementById("editCity").value = product.city || "";
            document.getElementById("editState").value = product.state || "";
            document.getElementById("editPhone").value = product.phone || "";
            new bootstrap.Modal(document.getElementById("editModal")).show();
        }

        async function saveChanges() {
            const productId = document.getElementById("editProductId").value;
            const updatedData = {
                name: document.getElementById("editName").value,
                price: Number(document.getElementById("editPrice").value),
                region: document.getElementById("editRegion").value,
                city: document.getElementById("editCity").value,
                state: document.getElementById("editState").value,
                phone: document.getElementById("editPhone").value,
            };
            try {
                const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
                const userData = await userRes.json();
                const updatedProducts = userData.products.map(p => 
                    p.id === productId ? { ...p, ...updatedData } : p
                );
                await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ products: updatedProducts })
                });
                showSuccess("تم التحديث بنجاح!");
                bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
                await loadDashboard();
            } catch (error) {
                handleError("حدث خطأ أثناء التحديث:", error);
            }
        }

        function showSuccess(message) {
            const toast = document.createElement('div');
            toast.className = 'glass-card position-fixed bottom-0 start-50 translate-middle-x mb-4 p-3 text-success';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function handleError(logMessage, error) {
            console.error(logMessage, error);
            alert("حدث خطأ غير متوقع!");
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function goToRequestPage() {
            window.location.href = `reaspet.html?userId=${currentUser.id}`;
        }
    </script>
</body>
</html>
