<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --primary-color: #4A90E2;
            --secondary-color: #03DAC5;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
        }

        /* شريط العنوان */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin: 0;
        }

        .btn-custom {
            background: var(--secondary-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #00c4b4;
        }

        /* بطاقات الإحصائيات */
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card h5 {
            color: var(--secondary-color);
            font-size: 16px;
        }

        .stat-card h2 {
            font-size: 24px;
            margin-top: 10px;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        /* قائمة المنتجات */
        .product-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card h5 {
            color: var(--primary-color);
        }

        .btn-danger, .btn-primary {
            padding: 5px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- الشريط العلوي -->
    <div class="header">
        <h1><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
        <div>
            <button class="btn btn-custom" onclick="goToRequestPage()">
                <i class="fa-solid fa-bell"></i> إجراء طلب
            </button>
            <button class="btn btn-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <!-- الإحصائيات -->
    <div class="row text-center">
        <div class="col-md-3 mb-3">
            <div class="stat-card">
                <h5>الطلبات الكلية</h5>
                <h2 id="total-orders">0</h2>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card">
                <h5>الطلبات الناجحة</h5>
                <h2 id="successful-orders">0</h2>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card">
                <h5>الطلبات المعلقة</h5>
                <h2 id="pending-orders">0</h2>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card">
                <h5>الطلبات المرفوضة</h5>
                <h2 id="rejected-orders">0</h2>
            </div>
        </div>
    </div>

    <!-- قائمة المنتجات -->
    <div class="row" id="products-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // التحقق من الجلسة
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if (!currentUser) window.location.href = "login.html";

    document.addEventListener("DOMContentLoaded", loadDashboard);

    async function loadDashboard() {
        try {
            const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${currentUser.id}`);
            const data = await response.json();

            document.getElementById("total-orders").innerText = data.total || 0;
            document.getElementById("successful-orders").innerText = data.successful || 0;
            document.getElementById("pending-orders").innerText = data.pending || 0;
            document.getElementById("rejected-orders").innerText = data.rejected || 0;

            renderProducts(data.products || []);
        } catch (error) {
            console.error("خطأ في تحميل البيانات:", error);
        }
    }

    function renderProducts(products) {
        const productsList = document.getElementById("products-list");
        productsList.innerHTML = products.map(product => `
            <div class="col-md-4 mb-3">
                <div class="product-card">
                    <h5><i class="fas fa-cube"></i> ${product.name}</h5>
                    <p><small>السعر: ${product.price} IQD</small></p>
                    <p><small><i class="fas fa-map-marker-alt"></i> المنطقة: ${product.region || "غير متوفر"}</small></p>
                    <p><small><i class="fas fa-city"></i> المدينة: ${product.city || "غير متوفر"}</small></p>
                    <p><small><i class="fas fa-phone"></i> ${product.phone || "غير متوفر"}</small></p>
                    <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                </div>
            </div>`).join("");
    }

    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
    }

    function goToRequestPage() {
        window.location.href = `reaspet.html?userId=${currentUser.id}`;
    }
</script>
</body>
</html>
