<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary: #2A9D8F;
    --secondary: #264653;
    --accent: #E9C46A;
    --text: #F8F9FA;
    --border: rgba(255,255,255,0.1);
    --card-bg: rgba(24, 38, 48, 0.9);
}

body {
    background: linear-gradient(180deg, #1A2F38 0%, #15232B 100%);
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    line-height: 1.6;
}

.container {
    max-width: 1200px;
    padding: 2rem 1.5rem;
}

/* User Info Section */
.user-info {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2.5rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.5rem;
    align-items: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}

.user-info i {
    background: rgba(42, 157, 143, 0.15);
    padding: 1.2rem;
    border-radius: 50%;
    font-size: 2.2rem;
    color: var(--primary);
}

.user-details h2 {
    font-size: 1.8rem;
    margin: 0 0 0.5rem;
    color: var(--text);
}

.user-details p {
    margin: 0.4rem 0;
    color: rgba(248, 249, 250, 0.9);
    display: flex;
    align-items: center;
    gap: 0.8rem;
}

/* Stats Grid */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2.5rem;
}

.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
    transition: transform 0.2s ease;
}

.stat-card:hover {
    transform: translateY(-3px);
}

.stat-icon {
    font-size: 2.5rem;
    color: var(--primary);
    margin-bottom: 1rem;
}

.stat-value {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text);
    margin: 0.5rem 0;
}

.stat-label {
    color: rgba(248, 249, 250, 0.8);
    font-size: 0.95rem;
}

/* Products Section */
.products-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
}

.section-title {
    font-size: 1.5rem;
    color: var(--text);
    margin: 0;
}

.product-list {
    display: grid;
    gap: 1.2rem;
}

.product-card {
    background: rgba(24, 38, 48, 0.6);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    position: relative;
}

.product-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.product-id {
    color: rgba(248, 249, 250, 0.7);
    font-size: 0.9rem;
}

.product-status {
    background: rgba(233, 196, 106, 0.15);
    color: var(--accent);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.85rem;
}

.product-details p {
    margin: 0.6rem 0;
    color: rgba(248, 249, 250, 0.9);
}

.product-actions {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.8rem;
}

/* Buttons */
.btn {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 6px;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: #238C7F;
}

.btn-danger {
    background: #E76F51;
    color: white;
}

.btn-danger:hover {
    background: #D94830;
}

/* Form Elements */
.form-group {
    margin-bottom: 1.2rem;
}

.form-input {
    width: 100%;
    padding: 0.8rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
}

.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.2);
}

/* Responsive Design */
@media (max-width: 768px) {
    .user-info {
        grid-template-columns: 1fr;
        text-align: center;
    }
    
    .stats-grid {
        grid-template-columns: 1fr;
    }
    
    .product-actions {
        flex-direction: column;
    }
    
    .btn {
        width: 100%;
    }
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: var(--primary);
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    const API_URL = `https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`;
    let userData = null;

    // تحميل البيانات الأولية
    async function loadUserData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            userData = await response.json();
            userData.products = userData.products?.map(p => ({ ...p, isEditing: false })) || [];
            updateUI();
        } catch (error) {
            showError(error.message);
        }
    }

    // تحديث الواجهة
    function updateUI() {
        elements.userName.textContent = userData.user || "مستخدم غير معروف";
        elements.userBalance.textContent = `رصيد: ${userData.balance || 0} $`;
        elements.userEmail.innerHTML = `<span class="material-icons-round">email</span> ${userData.email || "بريد غير متوفر"}`;
        
        elements.totalOrders.textContent = userData.totalOrders || 0;
        elements.successfulOrders.textContent = userData.successfulOrders || 0;
        elements.pendingOrders.textContent = userData.pendingOrders || 0;
        elements.canceledOrders.textContent = userData.rejectedOrders || 0;

        renderProducts();
        setupEventListeners();
        updateRequestButton(userData.type_user);
    }

    // عرض المنتجات
    function renderProducts() {
        elements.productList.innerHTML = userData.products.length > 0 
            ? userData.products.map((product, index) => `
                <div class="product-item" data-index="${index}">
                    <div class="product-header">
                        <span class="product-id">#${product.id}</span>
                        <span class="product-status">${product.status}</span>
                    </div>
                    ${product.isEditing ? getEditableFields(product, index) : getStaticFields(product)}
                    <div class="product-actions">
                        <button class="edit-btn">${product.isEditing ? 'حفظ التغييرات' : 'تعديل'}</button>
                        <button class="delete-btn">حذف المنتج</button>
                    </div>
                </div>
            `).join("")
            : `<div class="no-products">لا توجد منتجات متاحة</div>`;
    }

    // الحقول الثابتة
    function getStaticFields(product) {
        return `
            <div class="product-details">
                <p><strong>الاسم:</strong> ${product.name}</p>
                <p><strong>السعر:</strong> ${product.price}$</p>
                <p><strong>الموقع:</strong> ${[product.state, product.city, product.area].filter(Boolean).join(' - ')}</p>
                <p><strong>النوع:</strong> ${product.type}</p>
            </div>
        `;
    }

    // الحقول القابلة للتعديل
    function getEditableFields(product, index) {
        return `
            <div class="product-form">
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="name-${index}" value="${product.name}" required>
                </div>
                <div class="form-group">
                    <label>السعر ($):</label>
                    <input type="number" id="price-${index}" value="${product.price}" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="state-${index}" value="${product.state}">
                </div>
                <div class="form-group">
                    <label>المدينة:</label>
                    <input type="text" id="city-${index}" value="${product.city}">
                </div>
                <div class="form-group">
                    <label>المنطقة:</label>
                    <input type="text" id="area-${index}" value="${product.area}">
                </div>
                <div class="form-group">
                    <label>النوع:</label>
                    <input type="text" id="type-${index}" value="${product.type}">
                </div>
            </div>
        `;
    }

    // إعداد مستمعي الأحداث
    function setupEventListeners() {
        document.querySelectorAll('.edit-btn').forEach((btn, index) => {
            btn.addEventListener('click', async () => {
                const product = userData.products[index];
                if (product.isEditing) {
                    await handleSave(index);
                } else {
                    enterEditMode(index);
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach((btn, index) => {
            btn.addEventListener('click', () => handleDelete(index));
        });
    }

    // تفعيل وضع التعديل
    function enterEditMode(index) {
        userData.products[index].isEditing = true;
        updateUI();
        setTimeout(() => {
            const firstInput = document.querySelector(`#name-${index}`);
            if (firstInput) firstInput.focus();
        }, 100);
    }

    // معالجة الحفظ
    async function handleSave(index) {
        if (!validateInputs(index)) return;

        userData.products[index] = {
            ...userData.products[index],
            name: document.getElementById(`name-${index}`).value,
            price: parseFloat(document.getElementById(`price-${index}`).value),
            state: document.getElementById(`state-${index}`).value,
            city: document.getElementById(`city-${index}`).value,
            area: document.getElementById(`area-${index}`).value,
            type: document.getElementById(`type-${index}`).value,
            isEditing: false
        };

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحفظ');
            await loadUserData();
            showSuccess('تم حفظ التغييرات بنجاح');
        } catch (error) {
            showError(error.message);
            userData.products[index].isEditing = true;
            updateUI();
        }
    }

    // التحقق من صحة المدخلات
    function validateInputs(index) {
        let isValid = true;
        const requiredFields = [
            { id: `name-${index}`, message: 'حقل الاسم مطلوب' },
            { id: `price-${index}`, message: 'حقل السعر مطلوب' }
        ];

        requiredFields.forEach(({ id, message }) => {
            const input = document.getElementById(id);
            if (!input.value.trim()) {
                input.classList.add('invalid');
                isValid = false;
                showError(message);
            } else {
                input.classList.remove('invalid');
            }
        });

        return isValid;
    }

    // معالجة الحذف
    async function handleDelete(index) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

        try {
            userData.products.splice(index, 1);
            
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحذف');
            await loadUserData();
            showSuccess('تم حذف المنتج بنجاح');
        } catch (error) {
            showError(error.message);
            await loadUserData();
        }
    }

    // إدارة النتائج
    function showSuccess(message) {
        alert(message);
    }

    function showError(message) {
        alert(`خطأ: ${message}`);
    }

    // التهيئة الأولية
    await loadUserData();
    elements.requestButton.addEventListener("click", () => {
        window.location.href = "new-request.html";
    });

    function updateRequestButton(userType) {
        if (userType === 'admin') {
            elements.requestButton.style.display = 'none';
        }
    }
});
    </script>  
</body>
</html>
