<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
:root {
    --primary-color: #2A9D8F;
    --secondary-color: #264653;
    --accent-color: #E9C46A;
    --text-color: #ffffff;
    --error-color: #e76f51;
    --success-color: #2a9d8f;
}

body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
    color: var(--text-color);
    min-height: 100vh;
    padding: 20px 0;
    margin: 0;
    line-height: 1.6;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* تنسيقات معلومات المستخدم */
.user-info {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
}

.user-info i {
    font-size: 40px;
    color: var(--accent-color);
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    transition: transform 0.3s ease;
}

.user-info:hover i {
    transform: rotate(360deg);
}

.user-info h2 {
    margin: 0 0 8px 0;
    font-size: 1.8rem;
}

.user-info p {
    margin: 0;
    opacity: 0.9;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* التحديثات الجديدة للإحصائيات */
.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* صفين كل منهما به صندوقين */
    gap: 20px;
    margin-bottom: 30px;
}

.stat-box {
    background: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    min-height: 150px; /* ارتفاع موحد */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.stat-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.stat-box i {
    font-size: 32px;
    color: var(--accent-color);
    margin-bottom: 15px;
    display: block;
}

.stat-value {
    display: block;
    font-size: 2rem;
    font-weight: 700;
    margin-top: 10px;
    color: var(--accent-color);
}

/* باقي التنسيقات كما هي */
.products {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 25px;
    margin-top: 30px;
}

.products h3 {
    margin: 0 0 25px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.6rem;
}

.products h3 i {
    font-size: 28px;
    color: var(--accent-color);
}

.product-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.product-item.editing {
    border-color: var(--accent-color);
    animation: pulse 1.5s infinite;
}

.product-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.product-id {
    color: var(--accent-color);
    font-weight: 700;
    font-size: 0.9em;
}

.product-status {
    background: rgba(233, 196, 106, 0.1);
    color: var(--accent-color);
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.9em;
}

.product-details p {
    margin: 10px 0;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
}

.product-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--accent-color);
    font-weight: 600;
}

.form-group input {
    width: 100%;
    padding: 10px 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: var(--text-color);
    font-family: 'Cairo', sans-serif;
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(233, 196, 106, 0.1);
}

.form-group input.invalid {
    border-color: var(--error-color);
    animation: shake 0.5s;
}

.product-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-start;
}

.edit-btn, .delete-btn {
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.edit-btn {
    background-color: var(--accent-color);
    color: var(--secondary-color);
}

.delete-btn {
    background-color: var(--error-color);
    color: white;
}

.edit-btn:hover {
    background-color: #f4a261;
    transform: translateY(-2px);
}

.delete-btn:hover {
    background-color: #d94830;
    transform: translateY(-2px);
}

.alert {
    background-color: var(--error-color);
    color: #fff;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(233, 196, 106, 0.3); }
    70% { box-shadow: 0 0 0 15px rgba(233, 196, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(233, 196, 106, 0); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
}

/* التحديثات للجوال */
@media (max-width: 768px) {
    .stats {
        grid-template-columns: 1fr; /* عمود واحد للشاشات المتوسطة */
    }
    
    .stat-box {
        min-height: 120px; /* تقليل الارتفاع للجوال */
    }
    
    .user-info {
        flex-direction: column;
        text-align: center;
    }
}

@media (max-width: 480px) {
    .product-actions {
        flex-direction: column;
        width: 100%;
    }
    
    .edit-btn, .delete-btn {
        width: 100%;
        justify-content: center;
    }
}
</style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userBalance">الرصيد</p>
                <p id="userEmail">الاعدادات</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">pending</i>
                المعلقة
                <span class="stat-value" id="pendingOrders">0</span>
            </div>

            <div class="stat-box">
                <i class="material-icons-round">cancel</i>
                الملغاة
                <span class="stat-value" id="canceledOrders">0</span>
            </div>
        </div>

        <button id="requestButton" class="toggle-request">اجراء طلب</button>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
    const elements = {
        userName: document.getElementById("userName"),
        userBalance: document.getElementById("userBalance"),
        userEmail: document.getElementById("userEmail"),
        totalOrders: document.getElementById("totalOrders"),
        successfulOrders: document.getElementById("successfulOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        canceledOrders: document.getElementById("canceledOrders"),
        productList: document.getElementById("productList"),
        requestButton: document.getElementById("requestButton")
    };

    const userId = localStorage.getItem("loggedInUserId");
    if (!userId) {
        alert("يرجى تسجيل الدخول");
        window.location.href = "login.html";
        return;
    }

    const API_URL = `https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`;
    let userData = null;

    // تحميل البيانات الأولية
    async function loadUserData() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            userData = await response.json();
            userData.products = userData.products?.map(p => ({ ...p, isEditing: false })) || [];
            updateUI();
        } catch (error) {
            showError(error.message);
        }
    }

    // تحديث الواجهة
    function updateUI() {
        elements.userName.textContent = userData.user || "مستخدم غير معروف";
        elements.userBalance.textContent = `رصيد: ${userData.balance || 0} $`;
        elements.userEmail.innerHTML = `<span class="material-icons-round">email</span> ${userData.email || "بريد غير متوفر"}`;
        
        elements.totalOrders.textContent = userData.totalOrders || 0;
        elements.successfulOrders.textContent = userData.successfulOrders || 0;
        elements.pendingOrders.textContent = userData.pendingOrders || 0;
        elements.canceledOrders.textContent = userData.rejectedOrders || 0;

        renderProducts();
        setupEventListeners();
        updateRequestButton(userData.type_user);
    }

    // عرض المنتجات
    function renderProducts() {
        elements.productList.innerHTML = userData.products.length > 0 
            ? userData.products.map((product, index) => `
                <div class="product-item" data-index="${index}">
                    <div class="product-header">
                        <span class="product-id">#${product.id}</span>
                        <span class="product-status">${product.status}</span>
                    </div>
                    ${product.isEditing ? getEditableFields(product, index) : getStaticFields(product)}
                    <div class="product-actions">
                        <button class="edit-btn">${product.isEditing ? 'حفظ التغييرات' : 'تعديل'}</button>
                        <button class="delete-btn">حذف المنتج</button>
                    </div>
                </div>
            `).join("")
            : `<div class="no-products">لا توجد منتجات متاحة</div>`;
    }

    // الحقول الثابتة
    function getStaticFields(product) {
        return `
            <div class="product-details">
                <p><strong>الاسم:</strong> ${product.name}</p>
                <p><strong>السعر:</strong> ${product.price}$</p>
                <p><strong>الموقع:</strong> ${[product.state, product.city, product.area].filter(Boolean).join(' - ')}</p>
                <p><strong>النوع:</strong> ${product.type}</p>
            </div>
        `;
    }

    // الحقول القابلة للتعديل
    function getEditableFields(product, index) {
        return `
            <div class="product-form">
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="name-${index}" value="${product.name}" required>
                </div>
                <div class="form-group">
                    <label>السعر ($):</label>
                    <input type="number" id="price-${index}" value="${product.price}" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="state-${index}" value="${product.state}">
                </div>
                <div class="form-group">
                    <label>المدينة:</label>
                    <input type="text" id="city-${index}" value="${product.city}">
                </div>
                <div class="form-group">
                    <label>المنطقة:</label>
                    <input type="text" id="area-${index}" value="${product.area}">
                </div>
                <div class="form-group">
                    <label>النوع:</label>
                    <input type="text" id="type-${index}" value="${product.type}">
                </div>
            </div>
        `;
    }

    // إعداد مستمعي الأحداث
    function setupEventListeners() {
        document.querySelectorAll('.edit-btn').forEach((btn, index) => {
            btn.addEventListener('click', async () => {
                const product = userData.products[index];
                if (product.isEditing) {
                    await handleSave(index);
                } else {
                    enterEditMode(index);
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach((btn, index) => {
            btn.addEventListener('click', () => handleDelete(index));
        });
    }

    // تفعيل وضع التعديل
    function enterEditMode(index) {
        userData.products[index].isEditing = true;
        updateUI();
        setTimeout(() => {
            const firstInput = document.querySelector(`#name-${index}`);
            if (firstInput) firstInput.focus();
        }, 100);
    }

    // معالجة الحفظ
    async function handleSave(index) {
        if (!validateInputs(index)) return;

        userData.products[index] = {
            ...userData.products[index],
            name: document.getElementById(`name-${index}`).value,
            price: parseFloat(document.getElementById(`price-${index}`).value),
            state: document.getElementById(`state-${index}`).value,
            city: document.getElementById(`city-${index}`).value,
            area: document.getElementById(`area-${index}`).value,
            type: document.getElementById(`type-${index}`).value,
            isEditing: false
        };

        try {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحفظ');
            await loadUserData();
            showSuccess('تم حفظ التغييرات بنجاح');
        } catch (error) {
            showError(error.message);
            userData.products[index].isEditing = true;
            updateUI();
        }
    }

    // التحقق من صحة المدخلات
    function validateInputs(index) {
        let isValid = true;
        const requiredFields = [
            { id: `name-${index}`, message: 'حقل الاسم مطلوب' },
            { id: `price-${index}`, message: 'حقل السعر مطلوب' }
        ];

        requiredFields.forEach(({ id, message }) => {
            const input = document.getElementById(id);
            if (!input.value.trim()) {
                input.classList.add('invalid');
                isValid = false;
                showError(message);
            } else {
                input.classList.remove('invalid');
            }
        });

        return isValid;
    }

    // معالجة الحذف
    async function handleDelete(index) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

        try {
            userData.products.splice(index, 1);
            
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if (!response.ok) throw new Error('فشل في الحذف');
            await loadUserData();
            showSuccess('تم حذف المنتج بنجاح');
        } catch (error) {
            showError(error.message);
            await loadUserData();
        }
    }

    // إدارة النتائج
    function showSuccess(message) {
        alert(message);
    }

    function showError(message) {
        alert(`خطأ: ${message}`);
    }

    // التهيئة الأولية
    await loadUserData();
    elements.requestButton.addEventListener("click", () => {
        window.location.href = "new-request.html";
    });

    function updateRequestButton(userType) {
        if (userType === 'admin') {
            elements.requestButton.style.display = 'none';
        }
    }
});
    </script>  
</body>
</html>
