<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: white;
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .products {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .logout-btn {
            background: red;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <h2 id="userName">اسم المستخدم</h2>
            <p id="userEmail">البريد الإلكتروني</p>
            <button class="logout-btn" onclick="logoutUser()">تسجيل الخروج</button>
        </div>

        <div class="stats">
            <div class="stat-box">الطلبات: <span id="totalOrders">0</span></div>
            <div class="stat-box">الناجحة: <span id="successfulOrders">0</span></div>
            <div class="stat-box">المعلقة: <span id="pendingOrders">0</span></div>
            <div class="stat-box">الملغاة: <span id="canceledOrders">0</span></div>
        </div>

        <div class="products">
            <h3>المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const elements = {
            userName: document.getElementById("userName"),
            userEmail: document.getElementById("userEmail"),
            totalOrders: document.getElementById("totalOrders"),
            successfulOrders: document.getElementById("successfulOrders"),
            pendingOrders: document.getElementById("pendingOrders"),
            canceledOrders: document.getElementById("canceledOrders"),
            productList: document.getElementById("productList")
        };

        const userId = localStorage.getItem("loggedInUserId");
        if (!userId) {
            alert("يرجى تسجيل الدخول");
            window.location.href = "login.html";
            return;
        }

        try {
            const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${userId}`);
            if (!response.ok) throw new Error('فشل جلب بيانات المستخدم');
            
            const user = await response.json();
            updateUI(user);
        } catch (error) {
            console.error("حدث خطأ أثناء جلب البيانات:", error);
        }

        function updateUI(user) {
            elements.userName.textContent = user.user || "مستخدم غير معروف";
            elements.userEmail.textContent = user.email || "بريد غير متوفر";
            elements.totalOrders.textContent = user.totalOrders || 0;
            elements.successfulOrders.textContent = user.successfulOrders || 0;
            elements.pendingOrders.textContent = user.pendingOrders || 0;
            elements.canceledOrders.textContent = user.canceledOrders || 0;

            elements.productList.innerHTML = (user.products && Array.isArray(user.products)) 
                ? user.products.map(product => `
                    <div class="product-item">
                        <strong>الاسم:</strong> ${product.name || "غير متوفر"} <br>
                        <strong>المعرف:</strong> ${product.id || "غير متوفر"} <br>
                        <strong>السعر:</strong> ${product.price ? `${product.price}$` : "غير متوفر"} <br>
                        <strong>الولاية:</strong> ${product.state || "غير متوفر"} <br>
                        <strong>المدينة:</strong> ${product.city || "غير متوفر"} <br>
                        <strong>المنطقة:</strong> ${product.region || "غير متوفر"} <br>
                        <strong>الحالة:</strong> ${product.status || "غير متوفر"} <br>
                        <strong>النوع:</strong> ${product.type || "غير متوفر"} 
                    </div>
                `).join("")
                : `<div class="product-item">لا توجد منتجات</div>`;
        }
    });

    function logoutUser() {
        localStorage.removeItem("loggedInUserId");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
