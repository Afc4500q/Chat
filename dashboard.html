<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ... (بقية الhead كما هي) ... -->
</head>
<body>
    <!-- صفحة تسجيل الدخول (نفس الكود السابق) ... -->

    <!-- صفحة لوحة التحكم -->
    <div id="dashboard" style="display: none;" class="container-fluid py-4">
        <!-- معلومات المستخدم -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-lg">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-user-shield me-2"></i>المعلومات الشخصية</h4>
                    </div>
                    <div class="card-body">
                        <div id="user-info" class="row g-4"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-lg">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-chart-pie me-2"></i>إحصائيات الطلبات</h4>
                    </div>
                    <div class="card-body">
                        <div id="stats" class="row g-4"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- المنتجات -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-lg">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-boxes me-2"></i>قائمة المنتجات</h4>
                    </div>
                    <div class="card-body">
                        <div id="products-list" class="row g-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ... (كود تسجيل الدخول السابق) ...

        async function loadDashboard(userId) {
            try {
                const response = await axios.get(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
                const userData = response.data;
                
                // عرض المعلومات الشخصية
                document.getElementById('user-info').innerHTML = `
                    <div class="col-md-4">
                        <div class="d-flex align-items-center p-3 bg-light rounded-3">
                            <i class="fas fa-user-tag fs-3 text-primary me-3"></i>
                            <div>
                                <p class="mb-0 text-muted">الاسم الكامل</p>
                                <h4 class="mb-0 fw-bold">${userData.name}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center p-3 bg-light rounded-3">
                            <i class="fas fa-id-card fs-3 text-success me-3"></i>
                            <div>
                                <p class="mb-0 text-muted">اسم المستخدم</p>
                                <h4 class="mb-0 fw-bold">${userData.user}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center p-3 bg-light rounded-3">
                            <i class="fas fa-wallet fs-3 text-danger me-3"></i>
                            <div>
                                <p class="mb-0 text-muted">الرصيد المتاح</p>
                                <h4 class="mb-0 fw-bold currency">${userData.total} IQD</h4>
                            </div>
                        </div>
                    </div>
                `;

                // عرض الإحصائيات
                document.getElementById('stats').innerHTML = `
                    <div class="col-md-3">
                        <div class="stat-card p-4 text-white" style="background: #4A90E2">
                            <i class="fas fa-clipboard-list fs-2 mb-3"></i>
                            <h5 class="mb-1">الطلبات الكلية</h5>
                            <h1 class="mb-0 fw-bold">${userData.total}</h1>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card p-4 text-white" style="background: #6DD400">
                            <i class="fas fa-check-circle fs-2 mb-3"></i>
                            <h5 class="mb-1">الطلبات الناجحة</h5>
                            <h1 class="mb-0 fw-bold">${userData.successful}</h1>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card p-4 text-white" style="background: #FFC107">
                            <i class="fas fa-pause-circle fs-2 mb-3"></i>
                            <h5 class="mb-1">الطلبات المعلقة</h5>
                            <h1 class="mb-0 fw-bold">${userData.pending}</h1>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card p-4 text-white" style="background: #FF5252">
                            <i class="fas fa-times-circle fs-2 mb-3"></i>
                            <h5 class="mb-1">الطلبات المرفوضة</h5>
                            <h1 class="mb-0 fw-bold">${userData.rejected}</h1>
                        </div>
                    </div>
                `;

                // عرض المنتجات
                const productsList = document.getElementById('products-list');
                productsList.innerHTML = ''; // مسح المحتوى القديم
                userData.products.forEach(product => {
                    productsList.innerHTML += `
                        <div class="col-md-6 col-xl-4">
                            <div class="product-card p-4">
                                <div class="d-flex align-items-center mb-3">
                                    <i class="fas fa-cube fs-4 text-primary me-3"></i>
                                    <h5 class="mb-0 fw-bold">${product.name}</h5>
                                </div>
                                <div class="row g-3">
                                    <div class="col-6">
                                        <div class="text-muted">رقم الهاتف</div>
                                        <div class="fw-bold">
                                            <i class="fas fa-phone me-2"></i>
                                            ${product.phone || 'غير متوفر'}
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted">السعر</div>
                                        <div class="fw-bold currency">${product.price} IQD</div>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted">الحالة</div>
                                        <span class="badge badge-custom bg-${getStatusColor(product.status)}">${product.status}</span>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted">الولاية</div>
                                        <div>${product.state}</div>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted">المدينة</div>
                                        <div>${product.city}</div>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted">المنطقة</div>
                                        <div>${product.area}</div>
                                    </div>
                                    <div class="col-12">
                                        <hr class="my-2">
                                        <div class="d-flex justify-content-between text-muted small">
                                            <span>النوع: ${product.type}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('حدث خطأ في جلب البيانات:', error);
                showError('تعذر تحميل البيانات، يرجى المحاولة لاحقاً');
            }
        }
    </script>
</body>
</html>
