<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2A9D8F;
            --secondary-color: #264653;
            --accent-color: #E9C46A;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #264653 0%, #2A9D8F 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info i {
            font-size: 32px;
            color: var(--accent-color);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
        }

        .toggle-request {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .toggle-request:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background-color: red;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box i {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .products {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .product-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .product-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(10px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-info">
            <i class="material-icons-round">person</i>
            <div>
                <h2 id="userName">اسم المستخدم</h2>
                <p>مرحبًا بك في لوحة التحكم</p>
            </div>
            <div class="user-controls">
                <button id="toggleRequestBtn" class="toggle-request">
                    لا يوجد طلب <span class="status-indicator" id="requestIndicator"></span>
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <i class="material-icons-round">assignment</i>
                الطلبات
                <span class="stat-value" id="totalOrders">0</span>
            </div>
            <div class="stat-box">
                <i class="material-icons-round">check_circle</i>
                الناجحة
                <span class="stat-value" id="successfulOrders">0</span>
            </div>
        </div>

        <div class="products">
            <h3><i class="material-icons-round">inventory</i> المنتجات</h3>
            <div id="productList"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem("user"));
            const toggleRequestBtn = document.getElementById("toggleRequestBtn");
            const requestIndicator = document.getElementById("requestIndicator");

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            function updateRequestStatus(newStatus) {
                fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${user.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type_user: newStatus })
                })
                .then(response => response.json())
                .then(data => {
                    localStorage.setItem("user", JSON.stringify({ ...user, type_user: newStatus }));
                    updateButtonUI(newStatus);
                })
                .catch(error => console.error("خطأ في تحديث الحالة:", error));
            }

            function updateButtonUI(status) {
                if (status) {
                    toggleRequestBtn.textContent = "إلغاء الطلب";
                    requestIndicator.style.backgroundColor = "green";
                } else {
                    toggleRequestBtn.textContent = "لا يوجد طلب";
                    requestIndicator.style.backgroundColor = "red";
                }
            }

            toggleRequestBtn.addEventListener("click", () => {
                const newStatus = !user.type_user;
                updateRequestStatus(newStatus);
            });

            updateButtonUI(user.type_user);
        });
    </script>

</body>
</html>
