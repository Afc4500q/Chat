<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* ... (الأنماط السابقة تبقى كما هي) ... */

        /* أنماط جديدة للإعدادات */
        .settings-wrapper {
            position: relative;
            margin-right: auto;
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
            min-width: 180px;
            z-index: 1000;
        }

        .settings-menu.show {
            display: block;
        }

        .menu-item {
            padding: 10px;
            color: var(--secondary-color);
            cursor: pointer;
            transition: background 0.3s;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--secondary-color);
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }

        .error-message {
            color: #ff4444;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- إضافة قائمة الإعدادات -->
    <div class="settings-wrapper">
        <i class="material-icons-round settings-icon" onclick="toggleSettings()">settings</i>
        <div class="settings-menu" id="settingsMenu">
            <div class="menu-item" onclick="showEditForm('name')">
                <i class="material-icons-round">edit</i>
                تغيير الاسم
            </div>
            <div class="menu-item" onclick="showEditForm('password')">
                <i class="material-icons-round">lock_reset</i>
                تغيير كلمة المرور
            </div>
            <div class="menu-item" onclick="showEditForm('username')">
                <i class="material-icons-round">person</i>
                تغيير اليوزر
            </div>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <form id="editForm" onsubmit="handleFormSubmit(event)">
                <div id="formFields"></div>
                <div class="error-message" id="errorMessage"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- ... (بقية العناصر كما كانت) ... -->
    </div>

    <script>
        // متغيرات عامة
        let currentUser = null;
        let currentEditType = null;

        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) window.location.href = "login.html";

            // تحديث بيانات المستخدم
            updateUserData(user);
            
            // جلب البيانات من API
            fetch("https://679353885eae7e5c4d8e46e3.mockapi.io/Yo")
                .then(res => res.json())
                .then(users => {
                    currentUser = users.find(u => u.user === user.user && u.pass === user.pass);
                    if (currentUser?.products) displayProducts(currentUser.products);
                });
        });

        function toggleSettings() {
            document.getElementById('settingsMenu').classList.toggle('show');
        }

        function showEditForm(type) {
            currentEditType = type;
            const modalTitle = document.getElementById('modalTitle');
            const formFields = document.getElementById('formFields');
            
            const fields = {
                name: [
                    {label: 'الاسم الحالي', type: 'text', name: 'currentName', value: currentUser.name},
                    {label: 'الاسم الجديد', type: 'text', name: 'newName', required: true}
                ],
                password: [
                    {label: 'كلمة المرور الحالية', type: 'password', name: 'currentPassword', required: true},
                    {label: 'كلمة المرور الجديدة', type: 'password', name: 'newPassword', required: true}
                ],
                username: [
                    {label: 'اليوزر الحالي', type: 'text', name: 'currentUsername', value: currentUser.user},
                    {label: 'اليوزر الجديد', type: 'text', name: 'newUsername', required: true},
                    {label: 'كلمة المرور', type: 'password', name: 'currentPassword', required: true}
                ]
            };

            modalTitle.textContent = `تعديل ${type === 'name' ? 'الاسم' : type === 'password' ? 'كلمة المرور' : 'اليوزر'}`;
            formFields.innerHTML = fields[type].map(field => `
                <div class="form-group">
                    <label>${field.label}</label>
                    <input type="${field.type}" 
                           name="${field.name}" 
                           ${field.required ? 'required' : ''}
                           ${field.value ? `value="${field.value}" readonly` : ''}>
                </div>
            `).join('');

            document.getElementById('editModal').classList.add('show');
            toggleSettings();
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('errorMessage').style.display = 'none';
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const currentPassword = formData.get('currentPassword');
            const errorMessage = document.getElementById('errorMessage');

            // التحقق من كلمة المرور
            if (currentPassword && currentPassword !== currentUser.pass) {
                errorMessage.textContent = 'كلمة المرور الحالية غير صحيحة';
                errorMessage.style.display = 'block';
                return;
            }

            // تحديث البيانات
            const updatedData = {};
            switch(currentEditType) {
                case 'name':
                    updatedData.name = formData.get('newName');
                    break;
                case 'password':
                    updatedData.pass = formData.get('newPassword');
                    break;
                case 'username':
                    updatedData.user = formData.get('newUsername');
                    break;
            }

            try {
                const response = await fetch(`https://679353885eae7e5c4d8e46e3.mockapi.io/Yo/${currentUser.id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    const updatedUser = await response.json();
                    currentUser = updatedUser;
                    updateUserData(updatedUser);
                    closeModal();
                    alert('تم التحديث بنجاح!');
                }
            } catch (error) {
                console.error('Error updating user:', error);
                alert('حدث خطأ أثناء التحديث');
            }
        }

        function updateUserData(user) {
            document.getElementById("userName").textContent = user.name;
            document.getElementById("balance").textContent = user.balance;
            document.getElementById("totalOrders").textContent = user.totalOrders;
            document.getElementById("pendingOrders").textContent = user.pendingOrders;
            document.getElementById("rejectedOrders").textContent = user.rejectedOrders;
            document.getElementById("successfulOrders").textContent = user.successfulOrders;
            const rating = user.successfulOrders > 0 ? 
                (user.totalOrders / user.successfulOrders).toFixed(1) : 0;
            document.getElementById("myParagraph").textContent = rating;
            
            // تحديث localStorage
            localStorage.setItem("user", JSON.stringify({
                user: user.user,
                pass: user.pass,
                name: user.name,
                ...user
            }));
        }

        // ... (بقية الدوال كما كانت) ...
    </script>

</body>
</html>
