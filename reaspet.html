<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم طلب جديد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A3F5F;
            --secondary-color: #4A90E2;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f8f9fa;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            margin: 1rem auto;
            max-width: 600px;
            display: none;
        }
        .form-container.active {
            display: block;
        }
        .request-card {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            background: white;
        }
        .request-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .status-indicator {
            position: absolute;
            left: 15px;
            top: 15px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #28a745;
        }
        .request-actions {
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .required::after {
            content: " *";
            color: red;
            font-size: 0.8em;
        }
        .payment-field {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="text-primary"><i class="fa-solid fa-file-invoice"></i> تقديم طلب جديد</h1>
            <p class="text-muted">اختر نوع الطلب واملأ البيانات المطلوبة</p>
        </div>

        <!-- Type Selector -->
        <div class="d-flex justify-content-center gap-3 mb-5">
            <button class="btn btn-primary btn-lg" data-form="product-form">
                <i class="fa-solid fa-box-open"></i> طلب منتجات
            </button>
            <button class="btn btn-success btn-lg" data-form="payment-form">
                <i class="fa-solid fa-credit-card"></i> طلب دفع
            </button>
        </div>

        <!-- Product Order Form -->
        <div id="product-form" class="form-container">
            <h3 class="mb-4"><i class="fa-solid fa-list-check"></i> تفاصيل طلب المنتجات</h3>
            <form id="productForm">
                <div class="mb-3">
                    <label class="form-label required">عدد القطع المطلوبة</label>
                    <input type="number" class="form-control" id="totalOrders" min="1" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label required">عنوان التسليم الكامل</label>
                    <textarea class="form-control" id="deliveryAddress" rows="3" required></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane"></i> تأكيد الطلب
                    </button>
                </div>
            </form>
        </div>

        <!-- Payment Request Form -->
        <div id="payment-form" class="form-container">
            <h3 class="mb-4"><i class="fa-solid fa-money-check-dollar"></i> تفاصيل طلب الدفع</h3>
            <form id="paymentForm">
                <div class="mb-3">
                    <label class="form-label required">المبلغ المطلوب (IQD)</label>
                    <input type="number" class="form-control" id="paymentAmount" min="1000" step="500" required>
                </div>

                <div class="mb-3">
                    <label class="form-label required">طريقة الاستلام</label>
                    <select class="form-select" id="paymentMethod" required>
                        <option value="">-- اختر طريقة الدفع --</option>
                        <option value="Mastercard">ماستركارد</option>
                        <option value="ZainCash">زين كاش</option>
                        <option value="Cash">دفع نقدي</option>
                    </select>
                </div>

                <!-- Dynamic Fields -->
                <div id="cardFields" class="payment-field">
                    <div class="mb-3">
                        <label class="form-label required">رقم الحساب/البطاقة</label>
                        <input type="text" class="form-control" id="accountNumber">
                    </div>
                </div>

                <div id="cashFields" class="payment-field">
                    <div class="mb-3">
                        <label class="form-label required">موقع الاستلام</label>
                        <textarea class="form-control" id="cashAddress" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">رقم الهاتف</label>
                        <input type="tel" class="form-control" id="cashPhone" pattern="[0-9]{10}">
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-check-circle"></i> تأكيد عملية الدفع
                    </button>
                </div>
            </form>
        </div>

        <!-- عرض الطلبات -->
        <div class="mt-5">
            <!-- طلبات المنتجات -->
            <div id="product-requests" class="mb-5">
                <h4 class="mb-3"><i class="fa-solid fa-boxes-packing"></i> طلبات المنتجات الحالية</h4>
                <div id="productRequestsList"></div>
            </div>

            <!-- طلبات الدفع -->
            <div id="payment-requests">
                <h4 class="mb-3"><i class="fa-solid fa-money-bill-transfer"></i> طلبات الدفع الحالية</h4>
                <div id="paymentRequestsList"></div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="text-center mt-5">
            <a href="dashboard.html" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> العودة للوحة التحكم
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // الحصول على معرف المستخدم من الرابط
        // الحصول على معرف المستخدم من رابط الصفحة
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get('userId');

// تهيئة الصفحة عند التحميل
document.addEventListener('DOMContentLoaded', async () => {
    if (!userId) {
        alert('الوصول غير مصرح به!');
        window.location.href = 'login.html';
        return;
    }

    setupFormSwitcher();
    setupPaymentMethodHandler();
    setupFormSubmissions();
    await displayRequests();
});

// وظيفة تبديل النماذج
function setupFormSwitcher() {
    document.querySelectorAll('[data-form]').forEach(button => {
        button.addEventListener('click', (e) => {
            const formId = e.target.dataset.form;
            document.querySelectorAll('.form-container').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(formId).classList.add('active');
        });
    });
}

// إدارة حقول الدفع الديناميكية
function setupPaymentMethodHandler() {
    const paymentMethod = document.getElementById('paymentMethod');
    const toggleFields = () => {
        const method = paymentMethod.value;
        document.querySelectorAll('.payment-field').forEach(field => {
            field.style.display = 'none';
            field.querySelectorAll('input, textarea').forEach(input => {
                input.removeAttribute('required');
            });
        });

        if (method === 'Cash') {
            document.getElementById('cashFields').style.display = 'block';
            document.querySelectorAll('#cashFields input, #cashFields textarea').forEach(input => {
                input.setAttribute('required', 'true');
            });
        } else if (method === 'Mastercard' || method === 'ZainCash') {
            document.getElementById('cardFields').style.display = 'block';
            document.getElementById('accountNumber').setAttribute('required', 'true');
        }
    };

    paymentMethod.addEventListener('change', toggleFields);
    toggleFields();
}

// إعداد معالجة إرسال النماذج
function setupFormSubmissions() {
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        await handleFormSubmission({
            totlere: document.getElementById('totalOrders').value,
            adreesre: document.getElementById('deliveryAddress').value
        });
    });

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            pricere: document.getElementById('paymentAmount').value,
            byre: document.getElementById('paymentMethod').value
        };

        const method = formData.byre;
        if (method === 'Mastercard' || method === 'ZainCash') {
            formData.nure = document.getElementById('accountNumber').value;
        } else if (method === 'Cash') {
            formData.adrees2re = document.getElementById('cashAddress').value;
            formData.phonere = document.getElementById('cashPhone').value;
        }

        await handleFormSubmission(formData);
    });
}

// معالجة حفظ البيانات
async function handleFormSubmission(formData) {
    try {
        const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
        const userData = await response.json();

        const updatedData = {
            ...userData,
            vio: {
                ...userData.vio,
                ...formData,
                lastUpdated: new Date().toISOString()
            }
        };

        await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(updatedData)
        });

        // إغلاق النماذج وإعادة التهيئة
        document.querySelectorAll('.form-container').forEach(form => {
            form.classList.remove('active');
        });
        await displayRequests();
        alert('تم حفظ الطلب بنجاح!');
        window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (error) {
        console.error('Error:', error);
        alert('حدث خطأ أثناء الحفظ!');
    }
}

// عرض الطلبات الحالية
async function displayRequests() {
    try {
        const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
        const userData = await response.json();
        const vio = userData.vio || {};

        // عرض طلبات المنتجات
        let productRequestsHTML = '';
        if (vio.totlere && vio.totlere !== "0" && vio.adreesre) {
            productRequestsHTML = `
                <div class="request-card">
                    <div class="status-indicator"></div>
                    <h5>طلب منتجات</h5>
                    <p><strong>الكمية:</strong> ${vio.totlere}</p>
                    <p><strong>العنوان:</strong> ${vio.adreesre}</p>
                    <div class="request-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="editProductRequest()">
                            <i class="fa-solid fa-pen-to-square"></i> تعديل
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRequest('product')">
                            <i class="fa-solid fa-trash"></i> حذف
                        </button>
                    </div>
                </div>`;
        }
        document.getElementById('productRequestsList').innerHTML = productRequestsHTML;

        // عرض طلبات الدفع
        let paymentRequestsHTML = '';
        if (vio.pricere && vio.pricere !== "0" && vio.byre) {
            const paymentDetails = getPaymentDetails(vio);
            paymentRequestsHTML = `
                <div class="request-card">
                    <div class="status-indicator"></div>
                    <h5>طلب دفع</h5>
                    <p><strong>المبلغ:</strong> ${vio.pricere} IQD</p>
                    ${paymentDetails}
                    <div class="request-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="editPaymentRequest()">
                            <i class="fa-solid fa-pen-to-square"></i> تعديل
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRequest('payment')">
                            <i class="fa-solid fa-trash"></i> حذف
                        </button>
                    </div>
                </div>`;
        }
        document.getElementById('paymentRequestsList').innerHTML = paymentRequestsHTML;
    } catch (error) {
        console.error('Error loading requests:', error);
    }
}

// تفاصيل طرق الدفع
function getPaymentDetails(vio) {
    if (vio.byre === 'Cash') {
        return `
            <p><strong>طريقة الدفع:</strong> نقدي</p>
            <p><strong>عنوان الاستلام:</strong> ${vio.adrees2re || ''}</p>
            <p><strong>رقم الهاتف:</strong> ${vio.phonere || ''}</p>`;
    }
    return `
        <p><strong>طريقة الدفع:</strong> ${vio.byre}</p>
        <p><strong>رقم الحساب:</strong> ${vio.nure || ''}</p>`;
}

// حذف الطلب
async function deleteRequest(type) {
    if (!confirm(`هل أنت متأكد من حذف طلب ${type === 'product' ? 'المنتج' : 'الدفع'}؟`)) return;

    try {
        const response = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
        const userData = await response.json();
        
        const updatedVio = {...userData.vio};
        if (type === 'product') {
            delete updatedVio.totlere;
            delete updatedVio.adreesre;
        } else {
            delete updatedVio.pricere;
            delete updatedVio.byre;
            delete updatedVio.nure;
            delete updatedVio.adrees2re;
            delete updatedVio.phonere;
        }

        await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({...userData, vio: updatedVio})
        });

        await displayRequests();
        alert('تم الحذف بنجاح!');
    } catch (error) {
        console.error('Error deleting request:', error);
        alert('حدث خطأ أثناء الحذف!');
    }
}

// تعديل طلب المنتجات
async function editProductRequest() {
    const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
    const userData = await userRes.json();
    const vio = userData.vio || {};

    document.getElementById('totalOrders').value = vio.totlere;
    document.getElementById('deliveryAddress').value = vio.adreesre;
    document.getElementById('product-form').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// تعديل طلب الدفع
async function editPaymentRequest() {
    const userRes = await fetch(`https://673a394a339a4ce445179ae7.mockapi.io/User/${userId}`);
    const userData = await userRes.json();
    const vio = userData.vio || {};

    document.getElementById('paymentAmount').value = vio.pricere;
    document.getElementById('paymentMethod').value = vio.byre;
    if (vio.byre === 'Cash') {
        document.getElementById('cashAddress').value = vio.adrees2re || '';
        document.getElementById('cashPhone').value = vio.phonere || '';
    } else {
        document.getElementById('accountNumber').value = vio.nure || '';
    }
    document.getElementById('payment-form').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
    </script>
</body>
</html>
